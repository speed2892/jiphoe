<style>
:root{
  --bg:#f3f6f8; --surface:#fff; --surface-2:#f8fafb; --ink:#182b3b; --muted:#647586; --line:#dce4eb;
  --accent:#245b78; --accent-2:#173e54; --accent-ink:#fff; --accent-soft:#e8f1f6; --mark:#d7a83e;
  --ok:#2d7d46; --ok-soft:#e3f2e7; --warn:#9a6a00; --warn-soft:#fbf1d6; --bad:#b23b3b; --bad-soft:#f8e1e1;
  --display:"Gowun Batang",serif; --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --radius:16px; --shadow:0 1px 2px rgba(16,32,48,.04),0 8px 24px rgba(16,32,48,.06);
  --fs:1; --side:248px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#172430; --surface-2:#1c2b38; --ink:#e6eef3; --muted:#a3b3bf; --line:#2c3e4c;
  --accent:#79b8d5; --accent-2:#4e8eac; --accent-ink:#0f1f29; --accent-soft:#1f3747; --mark:#e7bd59;
  --ok:#7fc495; --ok-soft:#1d3527; --warn:#e7bd59; --warn-soft:#3a3120; --bad:#e58a7f; --bad-soft:#3b2222;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(15px * var(--fs))}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.7 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}

/* ---------- 레이아웃 ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:20px;flex:none}
.brand b{font-family:var(--display);font-size:1.3rem;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.78rem}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a .ic{font-size:1.15rem;width:24px;text-align:center}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted);padding:0 8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);width:fit-content}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--mark)} .dot.bad{background:var(--bad)}

.main{min-width:0}
.topbar{display:none}
.content{max-width:980px;margin:0 auto;padding:28px 26px 100px}

/* ---------- 공통 구성 요소 ---------- */
.hero{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;border-radius:20px;padding:24px 26px;margin-bottom:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1f4a61 0%,#122634 100%)}
.hero .kicker{font-size:.8rem;letter-spacing:.08em;opacity:.8}
.hero h1{font-family:var(--display);font-size:1.9rem;margin:4px 0 4px;line-height:1.3}
.hero p{margin:0;opacity:.9;max-width:640px}
.hero .big{position:absolute;right:22px;top:16px;font-size:3.4rem;opacity:.25}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:1.12rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card .desc{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
label{display:block;font-weight:600;font-size:.86rem;margin:12px 0 5px}
input[type=text],input[type=password],input[type=url],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{text-decoration:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:11px;padding:9px 16px;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.st{font-size:.86rem;color:var(--muted);min-height:1.4em;margin-top:8px}
.st.ok{color:var(--ok)} .st.err{color:var(--bad)}
.seg{display:inline-flex;background:var(--accent-soft);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.88rem;padding:7px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(16,32,48,.14)}
.note{font-size:.84rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:10px}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge.soon{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.stat{display:flex;gap:12px;align-items:flex-start}
.stat .ic{font-size:1.5rem;line-height:1}
.stat b{display:block}
.stat span{color:var(--muted);font-size:.86rem}
.plan{list-style:none;margin:0;padding:0}
.plan li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan li .ic{font-size:1.2rem;width:28px;text-align:center}
.plan li b{display:block}
.plan li span{color:var(--muted);font-size:.88rem}
details.more{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px;background:var(--surface-2)}
details.more summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.rops{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:10px;font-size:.9rem}
.rops label{display:inline-flex;gap:6px;align-items:center;font-weight:500;margin:0}
.rgrp{margin-top:14px}
.rgh{font-weight:700;font-size:.95rem;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.ritem{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-weight:400;cursor:pointer;background:var(--surface)}
.ritem:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ritem input{margin-top:5px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.ritem a{font-size:.82rem}
.rtx{color:var(--ink);opacity:.86;font-size:.88rem;white-space:pre-line;max-height:7.5em;overflow:auto;margin-top:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 모바일 ---------- */
@media (max-width:860px){
  .app{display:block}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .logo{width:34px;height:34px;font-size:17px;border-radius:10px}
  .topbar b{font-family:var(--display);font-size:1.12rem}
  .topbar .sp{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:11px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:600;padding:5px 2px;border-radius:10px}
  .bnav a .ic{font-size:1.25rem}
  .bnav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .content{padding:16px 12px calc(96px + env(safe-area-inset-bottom))}
  .hero{padding:20px;border-radius:16px}
  .hero h1{font-size:1.5rem}
  .hero .big{font-size:2.6rem}
  .card{padding:16px;border-radius:14px}
  .grid.c2,.grid.c3{grid-template-columns:1fr}
}
@media (min-width:861px){ .bnav{display:none} }

<script>
'use strict';
const APP = { name:'집회 준비', id:'jiphoe-hub', version:'0.8.4 (참조 출판물 원문)' };
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k, d=null){ try{ const v = localStorage.getItem(k); return v==null ? d : v; }catch(e){ return d; } },
             set(k, v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} } };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2600); }
const fmtTime = t => t ? new Date(t).toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '-';

/* =========================================================
   1. 설정 (이 기기에만 저장 — 동기화·백업에 들어가지 않음)
   ========================================================= */
const Settings = {
  _s: (()=>{ try{ return JSON.parse(LS.get('jh.settings','{}')) || {}; }catch(e){ return {}; } })(),
  get(k, d){ return this._s[k] ?? d; },
  set(k, v){ if(v==null || v==='') delete this._s[k]; else this._s[k] = v; LS.set('jh.settings', JSON.stringify(this._s)); document.dispatchEvent(new CustomEvent('settings', {detail:k})); }
};

/* =========================================================
   2. 저장소 (Store) — 모든 기능의 내용을 한 곳에.
   data[컬렉션][아이디] = 값,  stamps['컬렉션/아이디'] = 마지막 변경 시각
   → 기기 간 병합 때 항목마다 더 나중에 바꾼 쪽을 남긴다.
   ========================================================= */
const Store = (()=>{
  const KEY = 'jh.store.v1';
  let db = { v:1, data:{}, stamps:{} };
  try{ const j = JSON.parse(LS.get(KEY, 'null')); if(j && j.data) db = Object.assign({v:1, data:{}, stamps:{}}, j); }catch(e){}
  const subs = new Set();
  let saveTimer = null;
  const flush = () => { if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; LS.set(KEY, JSON.stringify(db)); } };
  const persist = () => { clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ saveTimer = null; LS.set(KEY, JSON.stringify(db)); }, 150); };
  addEventListener('pagehide', flush); document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flush(); });
  const emit = (info) => subs.forEach(fn=>{ try{ fn(info); }catch(e){ console.error(e); } });
  return {
    get(col, id, d=null){ const c = db.data[col]; return c && c[id] != null ? c[id] : d; },
    all(col){ const c = db.data[col] || {}; return Object.fromEntries(Object.entries(c).filter(([,v])=>v!=null)); },
    set(col, id, val, {silent=false, stamp=Date.now()} = {}){
      (db.data[col] ||= {})[id] = val; db.stamps[col+'/'+id] = stamp; persist();
      if(!silent) emit({col, id, local:true});
    },
    del(col, id){ this.set(col, id, null); },                 // null = 지운 표시(다른 기기에도 지워지도록)
    on(fn){ subs.add(fn); return ()=>subs.delete(fn); },
    snapshot(){ return JSON.parse(JSON.stringify(db)); },
    count(){ return Object.values(db.data).reduce((a,c)=>a+Object.values(c).filter(v=>v!=null).length, 0); },
    /* 다른 기기(또는 백업)의 내용과 합치기: 항목마다 나중 것 우선. 반환값: {changedLocal, remoteNeedsPush} */
    merge(other){
      let changedLocal = 0, remoteNeedsPush = false, conflicts = 0;
      const os = (other && other.stamps) || {}, od = (other && other.data) || {};
      const hash = value => { let h=2166136261; for(let i=0;i<value.length;i++){ h^=value.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); };
      for(const k of Object.keys(os)){
        const i = k.indexOf('/'); if(i<1) continue;
        const col = k.slice(0,i), id = k.slice(i+1), localStamp = Number(db.stamps[k]||0), remoteStamp = Number(os[k]||0);
        const localValue = db.data[col] ? (db.data[col][id] ?? null) : null;
        const remoteValue = od[col] ? (od[col][id] ?? null) : null;
        const localText = JSON.stringify(localValue), remoteText = JSON.stringify(remoteValue);
        if(localStamp===remoteStamp && localStamp>0 && localText!==remoteText){
          // 같은 시각에 서로 다른 내용이 저장된 경우, 한쪽을 버리지 않고 두 버전을 보관한다.
          const versions = [{stamp:localStamp, value:localValue},{stamp:remoteStamp, value:remoteValue}]
            .sort((a,b)=>{ const x=JSON.stringify(a.value), y=JSON.stringify(b.value); return x<y?-1:x>y?1:0; });
          const conflictId = hash(k+'|'+localStamp+'|'+JSON.stringify(versions));
          const conflict = {key:k, reason:'같은 저장 시각에 서로 다른 내용', versions};
          const bucket = (db.data.syncConflicts ||= {});
          if(JSON.stringify(bucket[conflictId])!==JSON.stringify(conflict)){
            bucket[conflictId] = conflict;
            db.stamps['syncConflicts/'+conflictId] = Math.max(localStamp,remoteStamp)+1;
            changedLocal++; conflicts++;
          }
          // 두 기기가 같은 원본을 유지하도록, 내용 정렬 결과의 첫 버전을 공통 기준으로 선택한다.
          if(localText!==JSON.stringify(versions[0].value)){ (db.data[col] ||= {})[id]=versions[0].value; changedLocal++; }
          remoteNeedsPush = true;
          continue;
        }
        if(localStamp < remoteStamp){
          (db.data[col] ||= {})[id] = remoteValue;
          db.stamps[k] = remoteStamp; changedLocal++;
        }
      }
      for(const k in db.stamps) if(Number(os[k]||0) < Number(db.stamps[k]||0)) { remoteNeedsPush = true; break; }
      if(changedLocal){ persist(); emit({remote:true, conflicts}); }
      return {changedLocal, remoteNeedsPush, conflicts};
    },
    conflicts(){ return Object.values(db.data.syncConflicts||{}); },
    replaceAll(other){ db = {v:1, data:other.data||{}, stamps:other.stamps||{}}; persist(); emit({remote:true}); }
  };
})();

/* =========================================================
   3. 기기 간 동기화 — GitHub 비공개 Gist 한 개
   ========================================================= */
const Sync = (()=>{
  const API = 'https://api.github.com', DESC = 'jiphoe-hub-sync', FILE = 'jiphoe-hub.json';
  let state = 'off', lastAt = Settings.get('syncAt', 0), pushTimer = null, busy = false, lastErr = '';
  const token = () => (Settings.get('ghToken','')||'').trim();
  const setState = (s, err='') => { state = s; lastErr = err; document.dispatchEvent(new CustomEvent('syncstate')); };
  async function gh(path, opt={}){
    const r = await fetch(API+path, {...opt, headers:{'Authorization':'Bearer '+token(), 'Accept':'application/vnd.github+json', ...(opt.headers||{})}});
    if(r.status===401) throw new Error('토큰이 맞지 않습니다.');
    if(r.status===403 || r.status===404) throw new Error('토큰에 gist 권한이 없거나 Gist를 찾지 못했습니다.');
    if(!r.ok) throw new Error('GitHub 오류 '+r.status);
    return r;
  }
  async function gistId(){
    let id = Settings.get('gistId','');
    if(id) return id;
    const list = await (await gh('/gists?per_page=100')).json();
    const found = list.find(g => g.description===DESC && g.files && g.files[FILE]);
    if(found) id = found.id;
    else id = (await (await gh('/gists', {method:'POST', body:JSON.stringify({description:DESC, public:false, files:{[FILE]:{content:'{"v":1,"data":{},"stamps":{}}'}}})})).json()).id;
    Settings.set('gistId', id); return id;
  }
  async function readRemote(id){
    const g = await (await gh('/gists/'+id)).json();
    const f = g.files && g.files[FILE]; if(!f) return {v:1, data:{}, stamps:{}};
    let text = f.content;
    if(f.truncated && f.raw_url) text = await (await fetch(f.raw_url)).text();
    try{ return JSON.parse(text||'{}'); }catch(e){ return {v:1, data:{}, stamps:{}}; }
  }
  async function now(){
    if(!token()){ setState('off'); return; }
    if(busy) return; busy = true; setState('busy');
    try{
      const id = await gistId();
      const remote = await readRemote(id);
      const merged = Store.merge(remote);
      if(merged.remoteNeedsPush){
        const snap = Store.snapshot();
        await gh('/gists/'+id, {method:'PATCH', body:JSON.stringify({files:{[FILE]:{content:JSON.stringify({v:1, app:APP.id, savedAt:Date.now(), data:snap.data, stamps:snap.stamps})}}})});
        // 업로드 직후 한 번 더 읽어, 그 사이 다른 기기에서 들어온 변경도 다음 병합 대상으로 잡는다.
        const verify = await readRemote(id);
        const check = Store.merge(verify);
        if(check.remoteNeedsPush){
          const latest = Store.snapshot();
          await gh('/gists/'+id, {method:'PATCH', body:JSON.stringify({files:{[FILE]:{content:JSON.stringify({v:1, app:APP.id, savedAt:Date.now(), data:latest.data, stamps:latest.stamps})}}})});
        }
      }
      lastAt = Date.now(); Settings.set('syncAt', lastAt); setState('ok');
    }catch(e){ setState('err', e.message||String(e)); }
    busy = false;
  }
  Store.on(info => { if(info.local && token()){ clearTimeout(pushTimer); pushTimer = setTimeout(now, 2500); } });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && token()) now(); });
  setInterval(()=>{ if(document.visibilityState==='visible' && token()) now(); }, 90*1000);
  /* 같은 Gist 안의 다른 파일 읽기 (jw-weekly.json 등) */
  async function readFile(name){
    if(!token()) return null;
    const g = await (await gh('/gists/'+await gistId())).json();
    const f = g.files && g.files[name]; if(!f) return null;
    return (f.truncated && f.raw_url) ? await (await fetch(f.raw_url)).text() : f.content;
  }
  return {
    now, token, readFile,
    status(){ return {state, lastAt, err:lastErr}; },
    async connect(tok){
      Settings.set('ghToken', tok.trim()); Settings.set('gistId', null);
      await gh('/gists?per_page=1');                 // 토큰 확인
      await now(); if(state==='err') throw new Error(lastErr);
    },
    disconnect(){ Settings.set('ghToken', null); Settings.set('gistId', null); setState('off'); }
  };
})();

/* =========================================================
   4. AI 엔진 — claude.ai 안에서는 내 Claude 계정, 밖에서는 API 키
   ========================================================= */
const AI = (()=>{
  let sample = null, probed = false;
  async function probe(){
    if(probed) return; probed = true;
    try{ if(window.claude && window.claude.use) sample = await window.claude.use('sample'); }catch(e){}
    document.dispatchEvent(new CustomEvent('aistate'));
  }
  const cleanKey = k => String(k||'').replace(/[^\x21-\x7E]/g,'');   // 키에 섞인 공백·한글·보이지 않는 문자 제거
  const key = () => cleanKey(Settings.get('apiKey',''));
  const openRouterKey = () => cleanKey(Settings.get('openrouterKey',''));
  const provider = () => Settings.get('aiProvider','openrouter');
  const model = () => Settings.get('model','claude-sonnet-5-5'); // 기존 Claude 모델(자료 조사 도구용)
  const openRouterModel = () => Settings.get('openrouterModel','openrouter/free');
  /* API 오류를 알아듣기 쉬운 말로 */
  function explain(status, body){
    let msg = ''; try{ const j = JSON.parse(body); msg = (j.error && j.error.message) || ''; }catch(e){ msg = String(body||''); }
    if(/credit balance/i.test(msg)) return '크레딧(잔액)이 부족합니다. console.anthropic.com → Billing(결제)에서 충전한 뒤 다시 해 보세요.';
    if(status===401 || /x-api-key|authentication/i.test(msg)) return '키가 맞지 않습니다. 키를 다시 복사해 넣어 주세요.';
    if(status===403) return '이 키로는 사용할 수 없습니다 (권한·조직 설정 확인).';
    if(status===404 || /model/i.test(msg) && /not.*found|invalid/i.test(msg)) return '모델을 찾지 못했습니다. 다른 모델을 골라 보세요.';
    if(status===429) return '사용 한도에 걸렸습니다. 잠시 후 다시 해 보세요.';
    if(status===529 || status>=500) return 'Anthropic 서버가 바쁩니다. 잠시 후 다시 해 보세요.';
    if(/usage limit|spend limit/i.test(msg)) return '월 사용 한도에 도달했습니다. console.anthropic.com → Limits에서 한도를 올려 주세요.';
    return msg ? msg.slice(0,200) : '알 수 없는 오류';
  }
  function mode(){
    if(provider()==='openrouter') return openRouterKey() ? 'openrouter' : null;
    return sample ? 'claude' : key() ? 'api' : null;
  }
  async function readSSE(r, onText, signal){
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '', all = '';
    for(;;){
      const {done, value} = await rd.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      let i; while((i = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, i).trim(); buf = buf.slice(i+1);
        if(!line.startsWith('data:')) continue;
        try{ const j = JSON.parse(line.slice(5)); if(j.type==='content_block_delta' && j.delta && j.delta.text){ all += j.delta.text; onText && onText(all); } if(j.type==='error') throw new Error(j.error && j.error.message); }catch(e){ if(e.message && !/JSON/.test(e.message)) throw e; }
      }
    }
    return all;
  }
  async function readOpenRouterSSE(r, onText, signal){
    const rd=r.body.getReader(), dec=new TextDecoder(); let buf='', all='';
    for(;;){
      if(signal && signal.aborted) throw new DOMException('중지했습니다.','AbortError');
      const {done,value}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); let i;
      while((i=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(!line.startsWith('data:')) continue;
        const raw=line.slice(5).trim(); if(!raw || raw==='[DONE]') continue;
        let j; try{j=JSON.parse(raw);}catch(e){continue;}
        const delta=j.choices && j.choices[0] && j.choices[0].delta;
        const part=delta && delta.content;
        if(typeof part==='string' && part){ all+=part; onText && onText(all); }
        else if(Array.isArray(part)){ const t=part.map(x=>x.text||'').join(''); if(t){all+=t;onText&&onText(all);} }
        if(j.error) throw new Error(j.error.message||'OpenRouter 응답 오류');
      }
    }
    return all;
  }
  /* write({system, prompt, onText, signal, maxTokens, tier}) → 전체 글 */
  async function write({system='', prompt, onText, signal, maxTokens=16000, tier='default'}){
    await probe();
    if(provider()==='openrouter'){
      if(!openRouterKey()) throw new Error('OpenRouter API 키가 없습니다. 설정에서 키를 저장해 주세요.');
      const messages=[]; if(system) messages.push({role:'system',content:system}); messages.push({role:'user',content:prompt});
      const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',signal,
        headers:{'content-type':'application/json','Authorization':'Bearer '+openRouterKey(),'HTTP-Referer':location.origin,'X-Title':'Jiphoe Helper'},
        body:JSON.stringify({model:openRouterModel(),max_tokens:maxTokens,stream:true,messages})});
      if(!r.ok){const t=await r.text();let msg=t;try{const j=JSON.parse(t);msg=j.error?.message||t;}catch(e){} throw new Error(`OpenRouter 오류 ${r.status} — ${String(msg).slice(0,240)}`);}
      return readOpenRouterSSE(r,onText,signal);
    }
    if(sample){
      try{ const r = await sample((system ? system+'\n\n' : '')+prompt, {modelTier:tier, cache:false, signal, onText:({text})=>onText && onText(text)}); return r.text; }
      catch(e){ const m = {not_granted:'Claude 사용을 허용하지 않으셨습니다.', rate_limited:'사용 한도에 걸렸습니다. 잠시 후 다시 해 보세요.'}[e && e.code]; throw new Error(m || (e && e.message) || '작성 중 오류'); }
    }
    if(!key()) throw new Error('Claude API 키가 없습니다. 설정에서 Claude 키를 넣어 주세요.');
    const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', signal,
      headers:{'content-type':'application/json','x-api-key':key(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:model(), max_tokens:maxTokens, stream:true, system: system || undefined, messages:[{role:'user', content:prompt}]})});
    if(!r.ok){ const t = await r.text(); throw new Error(`API 오류 ${r.status} — ` + explain(r.status, t)); }
    return readSSE(r, onText, signal);
  }
  let onResearchStatus=null, lastResearchModel='', freeCache=null;
  /* 도구 호출을 지원하는 OpenRouter 무료 모델 목록 (긴 문맥 순) */
  async function freeToolModels(){
    if(freeCache) return freeCache;
    const r=await fetch('https://openrouter.ai/api/v1/models'); if(!r.ok) throw new Error('models '+r.status);
    const d=(await r.json()).data||[];
    freeCache=d.filter(m=>{ const pr=m.pricing||{}; const isFree=/:free$/.test(m.id) || (+pr.prompt===0 && +pr.completion===0);
        return isFree && m.id!=='openrouter/free' && (m.supported_parameters||[]).includes('tools'); })
      .sort((a,b)=>(b.context_length||0)-(a.context_length||0)).map(m=>m.id);
    return freeCache;
  }
  /* jw.org 온라인 라이브러리 조사: OpenRouter의 서버측 web_fetch 사용 */
  async function research({prompt, maxTokens=12000, domains=['wol.jw.org','www.jw.org'], maxUses=10}={}){
    if(provider()==='openrouter'){
      const k=openRouterKey();
      if(!k) throw new Error('OpenRouter API 키가 없습니다. 설정에서 OpenRouter 키를 저장해 주세요.');
      /* 웹 가져오기 도구는 '도구 호출'을 지원하는 모델만 쓸 수 있다.
         openrouter/free 는 아무 무료 모델이나 고르므로, 도구를 지원하는 무료 모델을 직접 골라 차례로 시도한다. */
      const chosen=openRouterModel();
      const free=await freeToolModels().catch(()=>[]);
      const cands=[...new Set([...(chosen && chosen!=='openrouter/free' ? [chosen] : []), ...free.slice(0,5)])];
      if(!cands.length) cands.push(chosen||'openrouter/free');
      const fails=[];
      for(const m of cands){
        onResearchStatus && onResearchStatus(`웹 조사 모델: ${m}`);
        let r;
        try{
          r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',
            headers:{'content-type':'application/json','Authorization':'Bearer '+k,'HTTP-Referer':location.origin,'X-Title':'Jiphoe Helper'},
            body:JSON.stringify({model:m, max_tokens:maxTokens, messages:[{role:'user',content:prompt}],
              provider:{require_parameters:true},
              tools:[{type:'openrouter:web_fetch',parameters:{engine:'openrouter',allowed_domains:domains,max_uses:maxUses,max_content_tokens:30000}}]})});
        }catch(e){ fails.push(`${m}: 접속 실패`); continue; }
        if(!r.ok){
          const t=await r.text(); let msg=t; try{const j=JSON.parse(t);msg=j.error?.message||j.message||t;}catch(e){}
          if(r.status===401) throw new Error('OpenRouter 키가 맞지 않습니다.');
          if(r.status===402) throw new Error('OpenRouter 잔액이 필요합니다 — 웹 가져오기 도구는 무료 모델이어도 요금이 붙을 수 있습니다. 출판물 참조는 ‘📋 요청 글 복사’로 Claude 채팅에서 찾게 하세요.');
          fails.push(`${m}: ${r.status===429 ? '사용량 초과(잠시 후)' : String(msg).slice(0,80)}`); continue;
        }
        const j=await r.json(); const msg=j.choices?.[0]?.message;
        let out=msg?.content||''; if(Array.isArray(out)) out=out.map(x=>x.text||'').join('');
        if(String(out).trim()){ lastResearchModel=m; return String(out); }
        fails.push(`${m}: 빈 답변`);
      }
      throw new Error('무료 모델로 웹 조사를 하지 못했습니다 ('+fails.join(' / ')+'). 잠시 후 다시 하거나, ‘📋 요청 글 복사’로 Claude 채팅에서 찾게 하세요.');
    }
    const k=key();
    if(!k) throw new Error('Claude를 선택한 경우에는 Claude API 키가 필요합니다.');
    const tools=[{type:'web_fetch_20250910',name:'web_fetch',max_uses:maxUses,allowed_domains:domains}];
    const messages=[{role:'user',content:prompt}]; let out='';
    for(let turn=0;turn<5;turn++){
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:model(),max_tokens:maxTokens,tools,messages})});
      if(!r.ok) throw new Error('Claude API 오류 '+r.status+' — '+explain(r.status,await r.text()));
      const j=await r.json();
      out+=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
      if(j.stop_reason!=='pause_turn') break;
      messages.push({role:'assistant',content:j.content});
    }
    return out;
  }
  async function test(k, m, p='openrouter'){
    k = cleanKey(k);
    if(p==='openrouter'){
      const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+k,'HTTP-Referer':location.origin,'X-Title':'Jiphoe Helper'},body:JSON.stringify({model:m||'openrouter/free',max_tokens:8,messages:[{role:'user',content:'안녕. 짧게 인사해 주세요.'}]})});
      if(!r.ok){const t=await r.text();let msg=t;try{const j=JSON.parse(t);msg=j.error?.message||t;}catch(e){}throw new Error(`오류 ${r.status} — ${String(msg).slice(0,240)}`);} return true;
    }
    const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST',
      headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:m, max_tokens:5, messages:[{role:'user', content:'안녕'}]})});
    if(!r.ok){ const t = await r.text(); throw new Error(`오류 ${r.status} — ` + explain(r.status, t)); }
    return true;
  }
  return {probe, mode, write, research, test, model, openRouterModel, provider, explain, freeToolModels, setResearchStatus:f=>{onResearchStatus=f;}, lastResearchModel:()=>lastResearchModel};
})();

/* =========================================================
   5. 기존 앱 데이터 가져오기
   - 집회 계획표: ‘내보내기’ 글({app:"jipoe-plan", data:{…}}) 또는 같은 주소에서 쓰던 기록
   - 연설문 도우미: 같은 주소에서 쓰던 기록(speechHelper.v2)
   가져온 원본은 legacy 컬렉션에 그대로 보관하고, 각 기능을 만들 때 새 형식으로 옮긴다.
   ========================================================= */
const Legacy = {
  isMeetingKey: k => /^(coach-|wt_|st_|sync:)/.test(k),
  summarize(obj){
    const c = {names:0, wt:0, gems:0, other:0};
    for(const k in obj){ if(/^coach-/.test(k)) c.names++; else if(/^wt_/.test(k)) c.wt++; else if(/^st_/.test(k)) c.gems++; else c.other++; }
    return c;
  },
  importMeeting(obj, source){
    let n = 0;
    for(const k in obj){ if(this.isMeetingKey(k)){ Store.set('legacyMeeting', k, obj[k], {silent:true}); n++; } }
    Store.set('meta', 'legacyMeetingImport', {at:Date.now(), source, count:Object.keys(Store.all('legacyMeeting')).length});
    return n;
  },
  scanThisDevice(){
    const meeting = {}; let speech = null;
    try{
      for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(this.isMeetingKey(k)) meeting[k] = localStorage.getItem(k); }
      const sp = localStorage.getItem('speechHelper.v2'); if(sp) speech = JSON.parse(sp);
    }catch(e){}
    return {meeting, speech};
  },
  importSpeech(obj, source){
    Store.set('legacySpeech', 'draft', obj, {silent:true});
    Store.set('meta', 'legacySpeechImport', {at:Date.now(), source, sections:(obj.sections||[]).length, topic:obj.topic||''});
  }
};


/* =========================================================
   5-2. 주간 집회 (이번 주 계획·임명표·순서지)
   주 하나 = { id:'2026-11-09'(월요일), label, reading, songs:[시작,중간,마침], chair, prayerOpen, prayerClose, note,

const Members = {
  ROLES: ['장로','봉사의 종','파이오니아','전도인'],
  clean: n => String(n||'').replace(/\s+/g,'').trim(),
  all(){ return Object.values(Store.all('members')).sort((a,b)=>a.name.localeCompare(b.name,'ko')); },
  has(n){ return !!Store.get('members', this.clean(n)); },
  add(m){ const name = this.clean(m.name); if(!name) return false;
    Store.set('members', name, { name, gender:m.gender||'U', group:m.group||'', role:m.role||'전도인', car:!!m.car }); return true; },
  remove(n){ Store.del('members', this.clean(n)); },
  /* 임명표·기존 기록에 쓰인 이름 */
  usedNames(){
    const set = new Set(Weeks.usedNames());
    for(const k in Store.all('legacyMeeting')){ const m = /^coach-(.+)$/.exec(k); if(m && /^[가-힣]{2,5}$/.test(m[1].trim())) set.add(m[1].trim()); }
    return set;
  },
  /* 명단 비교: 반환 {added:[], existed:[], notInRoster:[]} — apply=false면 미리보기만 */
  importRoster(json, apply=true){
    const d = typeof json==='string' ? JSON.parse(json) : json;
    const list = Array.isArray(d) ? d : (d && d.members) || [];
    if(!list.length) throw new Error('명단(members)이 비어 있습니다');
    const added = [], existed = [], seen = new Set();
    for(const raw of list){
      const m = typeof raw==='string' ? {name:raw} : raw; const name = this.clean(m && m.name);
      if(!name || seen.has(name)) continue; seen.add(name);
      if(this.has(name)) existed.push(name);
      else { added.push(name); if(apply) this.add({...m, name}); }
    }
    if(apply && d && Array.isArray(d.couples)){
      const cs = Store.get('meta','couples',[]) || [], key = c=>[c.a,c.b].sort().join('|'), have = new Set(cs.map(key));
      d.couples.forEach(c=>{ if(c && c.a && c.b && !have.has(key(c))){ cs.push({a:this.clean(c.a), b:this.clean(c.b)}); have.add(key(c)); } });
      Store.set('meta','couples',cs);
    }
    const used = this.usedNames(), notInRoster = [...used].filter(n=>!seen.has(n) && !this.has(n)).sort((a,b)=>a.localeCompare(b,'ko'));
    return {added, existed, notInRoster};
  },
  spouse(n){ n = this.clean(n); const c = (Store.get('meta','couples',[])||[]).find(c=>c.a===n||c.b===n); return c ? (c.a===n?c.b:c.a) : ''; },
  label(m){ return [m.group, m.role, m.gender==='M'?'형제':m.gender==='F'?'자매':''].filter(Boolean).join(' · '); }

const Weeks = {
  pad: n => String(n).padStart(2,'0'),
  ymd(d){ return `${d.getFullYear()}-${this.pad(d.getMonth()+1)}-${this.pad(d.getDate())}`; },
  monday(d=new Date()){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; },
  thisId(){ return this.ymd(this.monday()); },
  labelOf(id){ const a = new Date(id+'T00:00:00'), b = new Date(a); b.setDate(a.getDate()+6);
    return a.getMonth()===b.getMonth() ? `${a.getMonth()+1}월 ${a.getDate()}-${b.getDate()}일` : `${a.getMonth()+1}월 ${a.getDate()}일–${b.getMonth()+1}월 ${b.getDate()}일`; },
  /* "11월 9-15일" 같은 표시에서 월요일 날짜 찾기 (연도는 가까운 쪽으로) */
  idFromLabel(label, yearHint){
    const m = String(label).match(/(\d{1,2})\s*월\s*(\d{1,2})/); if(!m) return null;
    const now = new Date(); let y = yearHint || now.getFullYear();
    if(!yearHint){ const diff = (+m[1]) - (now.getMonth()+1); if(diff > 6) y--; else if(diff < -6) y++; }
    return this.ymd(this.monday(new Date(y, +m[1]-1, +m[2])));
  },
  ids(){ return Object.keys(Store.all('weeks')).sort(); },
  /* 저장된 주 + 이번 주부터 앞으로 4주 (교재가 없어도 고를 수 있게) */
  allIds(){ const s = new Set(this.ids()); const m = this.monday(); for(let k=0;k<5;k++){ const d = new Date(m); d.setDate(m.getDate()+7*k); s.add(this.ymd(d)); } return [...s].sort(); },
  get(id){ return Store.get('weeks', id); },
  save(w){ w.updatedAt = Date.now(); w.label = this.labelOf(w.id); Store.set('weeks', w.id, w); },
  blank(id){
    return {id, label:this.labelOf(id), reading:'', songs:['','',''], chair:'', prayerOpen:'', prayerClose:'', note:'', parts:[
      {no:1, sec:'treasure', title:'', min:10, sub:'', detail:'', who:''},
      {no:2, sec:'treasure', title:'영적 보물 찾기', min:10, sub:'', detail:'', who:''},
      {no:3, sec:'treasure', title:'성경 낭독', min:4, sub:'', detail:'', who:''},
      {no:4, sec:'ministry', title:'', min:3, sub:'', detail:'', who:''},
      {no:5, sec:'ministry', title:'', min:4, sub:'', detail:'', who:''},
      {no:6, sec:'ministry', title:'', min:5, sub:'', detail:'', who:''},
      {no:7, sec:'life', title:'', min:15, sub:'', detail:'', who:''},
      {no:8, sec:'life', title:'회중 성서 연구', min:30, sub:'', detail:'', who:''}]};
  },
  /* 집회 교재 글(jw.org에서 복사하거나 D:\JW의 “…_집회교재_….txt”) → 주 목록 */
  parseWorkbook(text, fileName='', fallbackId=null){
    const yearHint = (fileName.match(/^(\d{4})-\d{2}-\d{2}/)||[])[1];
    const lines = String(text).replace(/\ufeff/g,'').split(/\r?\n/).map(l=>l.replace(/\s+$/,''));
    const HEAD = /^\s*(?:(\d{4})\s*년\s*)?(\d{1,2})\s*월\s*(\d{1,2})\s*일?\s*[-–~]\s*(?:(\d{1,2})\s*월\s*)?(\d{1,2})\s*일\s*$/;
    const blocks = []; let cur = null;
    for(const l of lines){ const hm = l.match(HEAD); if(hm){ cur = {label:l.trim().replace(/^\d{4}\s*년\s*/,''), year:hm[1]?+hm[1]:0, lines:[]}; blocks.push(cur); } else if(cur) cur.lines.push(l); }
    if(!blocks.length && fallbackId && /성경에 담긴 보물|야외 봉사에 힘쓰십시오/.test(text)) blocks.push({label:this.labelOf(fallbackId), year:0, lines, forceId:fallbackId});
    return blocks.map(b=>{
      const id = b.forceId || this.idFromLabel(b.label, b.year || (yearHint ? +yearHint : 0));
      const w = {id, label:b.label.replace(/\s+/g,' '), reading:'', songs:['','',''], chair:'', prayerOpen:'', prayerClose:'', note:'', parts:[], src:''};
      let sec = 'treasure', part = null, gotTime = false;
      const flush = () => { if(part){ part.detail = part.detail.replace(/\n{3,}/g,'\n\n').trim(); w.parts.push(part); part = null; } };
      for(let raw of b.lines){
        const l = raw.trim(); if(!l) { if(part && part.detail) part.detail += '\n'; continue; }
        if(/^답을 적는 칸$/.test(l)) continue;
        let m;
        if((m = l.match(/^출처:\s*(\S+)/))){ w.src = m[1]; continue; }
        if(!w.reading && !/노래|^\d+\.|^(성경에 담긴 보물|야외 봉사에 힘쓰십시오|그리스도인 생활)$/.test(l) && !w.parts.length && !part && l.length < 40){ w.reading = l; continue; }
        if(/^성경에 담긴 보물$/.test(l)){ flush(); sec='treasure'; continue; }
        if(/^야외 봉사에 힘쓰십시오$/.test(l)){ flush(); sec='ministry'; continue; }
        if(/^그리스도인 생활$/.test(l)){ flush(); sec='life'; continue; }
        if(/노래\s*\d+/.test(l) && !/^\d{1,2}\.\s/.test(l)){
          const nums = [...l.matchAll(/노래\s*(\d{1,3})/g)].map(x=>x[1]);
          if(/맺음말|마치는/.test(l)){ flush(); w.songs[2] = nums[nums.length-1]; continue; }
          if(/소개말|시작/.test(l) || (!w.parts.length && !part)){ w.songs[0] = w.songs[0] || nums[0]; if(nums[1] && /중간/.test(l)) w.songs[1] = nums[1]; continue; }
          if(l.length < 40){ flush(); if(!w.songs[1]) w.songs[1] = nums[0]; else w.songs[2] = w.songs[2] || nums[0]; continue; }
        }
        if((m = l.match(/^(\d{1,2})\.\s*(.+)$/)) && +m[1] <= 12 && (!part || gotTime || +m[1] === part.no+1)){
          flush(); part = {no:+m[1], sec, title:m[2].trim(), min:0, sub:'', detail:'', who:''}; gotTime = false;
          const im = part.title.match(/^(.*?)\s*\((\d{1,2})\s*분\)\s*[:：.]?\s*(.*)$/);
          if(im){ part.title = im[1].trim(); part.min = +im[2]; const rest = im[3].trim(); if(rest){ if(rest.length <= 70) part.sub = rest; else part.detail = rest; } gotTime = true; }
          continue;
        }
        if(part && !gotTime && (m = l.match(/^\((\d+)\s*분\)\s*(.*)$/))){ part.min = +m[1]; part.sub = m[2].trim(); gotTime = true; continue; }
        if(part) part.detail += (part.detail ? '\n' : '') + l;
      }
      flush();
      return w;
    }).filter(w=>w.id && w.parts.length);
  },
  /* 새로 들어온 주를 기존 주와 합치기: 교재 내용은 새것, 이름 배정은 비어 있지 않은 쪽 */
  mergeInto(n, {preferNew=false} = {}){
    const o = this.get(n.id);
    if(!o){ this.save(n); return 'new'; }
    const keep = (a,b) => (a && String(a).trim()) ? a : b;
    const w = {...o, label:n.label||o.label, reading:(n.reading && !/^성경에 담긴 보물$/.test(n.reading)) ? n.reading : (/^성경에 담긴 보물$/.test(o.reading||'') ? '' : o.reading), src:n.src||o.src,
      songs:[0,1,2].map(i=>n.songs[i]||o.songs[i]||''),
      chair:keep(o.chair,n.chair), prayerOpen:keep(o.prayerOpen,n.prayerOpen), prayerClose:keep(o.prayerClose,n.prayerClose), note:keep(o.note,n.note)};
    /* 순서 목록은 교재 내용이 더 풍부한 쪽을 바탕으로, 이름은 이미 적힌 것을 우선 */
    const score = ps => (ps||[]).length + 3*(ps||[]).filter(p=>p.detail).length;
    const op = o.parts||[], np = n.parts||[], base = (preferNew && np.length) || score(np) >= score(op) ? np : op, other = base===np ? op : np;
    w.parts = base.map(p=>{ const q = other.find(x=>x.no===p.no) || {};
      const oldP = base===np ? q : p, newP = base===np ? p : q;

  /* Firestore REST 값 → 일반 JSON */
  fsVal(v){

    if('booleanValue' in v) return v.booleanValue; if('nullValue' in v) return null; if('timestampValue' in v) return v.timestampValue;

const SCR = /([가-힣]{1,8}\d?)\s*(\d{1,3})\s*(?:장|:)\s*(\d{1,3})(?:\s*절)?(?:\s*[-–~]\s*(\d{1,3}))?(?:\s*절)?/g;

    else map[key] += ' '+tok;

const BOOK_LIST = Object.keys(BOOKS).slice(0,66).map(k=>BOOKS[k]);      // 창세기 … 요한 계시록 (성경 순서)
const BOOK_ALIAS = {창세:'창세기',출애굽:'출애굽기',레위:'레위기',민수:'민수기',신명:'신명기',사사:'사사기',욥:'욥기',시편:'시편',잠언:'잠언',전도:'전도서',이사야:'이사야',예레미야:'예레미야',애가:'예레미야 애가',에스겔:'에스겔',다니엘:'다니엘',
  마태:'마태복음',마가:'마가복음',누가:'누가복음',요한:'요한복음',사도:'사도행전',로마:'로마서',갈라디아:'갈라디아서',에베소:'에베소서',빌립보:'빌립보서',골로새:'골로새서',디도:'디도서',빌레몬:'빌레몬서',히브리:'히브리서',야고보:'야고보서',유다:'유다서',계시:'요한 계시록',계시록:'요한 계시록'};
function fullBook(b){
  if(BOOKS[b]) return BOOKS[b];
  if(BOOK_ALIAS[b]) return BOOK_ALIAS[b];
  for(let k=0;k<b.length;k++){ const s=b.slice(k); if(BOOKS[s]) return BOOKS[s]; if(BOOK_ALIAS[s]) return BOOK_ALIAS[s]; }
  return null;
}
// "고린도 첫째 15:6" → "고린도전서 15:6", "사무엘 첫째 2:6" → "사무엘상 2:6", "요한 첫째 4:8" → "요1 4:8"
function normOrdinals(text){
  return String(text).replace(/([가-힣]+)\s*(첫째|둘째|셋째)\s*(?=\d)/g, (m,b,o)=>{
    const n = {첫째:1,둘째:2,셋째:3}[o];
    if(b==='요한') return '요'+n+' ';
    if(/^(사무엘|열왕기|역대기)$/.test(b)) return b+(n===1?'상':'하')+' ';
    return b+(n===1?'전서':'후서')+' ';
  });
}
const bookNo = full => BOOK_LIST.findIndex(b=>b.replace(/\s/g,'')===String(full).replace(/\s/g,''))+1;
// "겔 8:5, 9, 10, 16; 22:6" → 에스겔 8:5 / 8:9 / 8:10 / 8:16 / 22:6
function extractScriptures(text){
  text = normOrdinals(text);
  const found = [];
  for(const m of text.matchAll(SCR)){
    const bk = fullBook(m[1]); if(!bk) continue;
    found.push(`${bk} ${m[2]}:${m[3]}${m[4]?'-'+m[4]:''}`);
    const tail = text.slice(m.index+m[0].length).split(/[)\]」]/)[0];
    let ch = m[2];
    for(const t of tail.matchAll(/([,;])\s*(?:(\d{1,3})\s*:\s*)?(\d{1,3})(?:\s*[-–]\s*(\d{1,3}))?(?!\s*[면항\d])/g)){
      if(t[1]===';' && !t[2]) break;                 // ";" 뒤에 장:절이 아니면 다른 출판물 참조
      if(t[2]) ch = t[2];
      found.push(`${bk} ${ch}:${t[3]}${t[4]?'-'+t[4]:''}`);
    }
  }
  return found;
}
function stripScriptures(text){
  return normOrdinals(text).replace(/「[^」]*」/g,' ').replace(SCR,' ').replace(/\d+(?:\s*[-–]\s*\d+)?\s*(?:면|항)/g,' ')
             .replace(/[()（）\[\]『』“”"';]/g,' ').replace(/\s+/g,' ').trim();
}
const SUFFIX = ['께서는','께서도','께서','들이','들은','들을','들의','들에게','에게서','으로서','으로','에서','에게','에는','이며','하며','하고','합니다','입니다','하는','있으며','있는','있다','한다','해야','해','하여','되어','된','한','은','는','이','가','을','를','의','에','로','와','과','도','만','며','고','다'];
const STOP = new Set(['것','수','그','이런','있는','없는','오늘날','때문','대한','통해','위해','같은','모든','가득','가득차','사람','사람들','낭독','설명','시각','자료','있다','없다','들은','것을','것이','날의','날이','되는','하는','어떤','그런','또한','이는','하지','않는','위한','대해','대한','관한','필요','필요가','에서','것인가','것인지','오고','있으','가져야','날을','날이','날은','수도','그리고','하지만','그러나','이러한','그러한','때에']);
const PROTECT = new Set(['여호와','하느님','예수','그리스도','아마겟돈','에스겔','여호와의','하느님의']);   // 조사 떼기에서 보호할 고유어
function stem(w){
  if(PROTECT.has(w)) return w;
  for(const s of SUFFIX){
    if(w.endsWith(s) && w.length > s.length+1) return w.slice(0,-s.length);   // 남는 글자가 2자 이상일 때만 조사를 뗀다("정의" 같은 낱말 보호)
  }
  return w;
}
function keywordsOf(line){
  return stripScriptures(line).split(/[\s,·、…]+/)
    .map(w=>w.replace(/[?!.:;'"“”‘’]+$/,'').replace(/^[“‘"']+/,''))
    .map(stem)
    .filter(w=>w.length>=2 && !STOP.has(w) && !/\d/.test(w) && /[가-힣]/.test(w) && !/다$/.test(w));
}
const csv = s => (s||'').split(/[,，、]/).map(x=>x.trim()).filter(Boolean);

  if(token && !force) return token;

  if(!r.ok) throw new Error('토큰 요청 실패 '+r.status);

const plain = h => { const t=document.createElement('textarea'); t.innerHTML=String(h||'').replace(/<[^>]+>/g,''); return t.value.replace(/ /g,' ').replace(/\s+/g,' ').trim(); };
async function jwSearch(q, limit=8){
  const go = async force => fetch(`https://b.jw-cdn.org/apis/search/results/KO/all?q=${encodeURIComponent(q)}&limit=${limit}`,
                                   {headers:{Authorization:'Bearer '+await getToken(force)}});
  let r = await go(false); if(r.status===401||r.status===403) r = await go(true);
  if(!r.ok) throw new Error('검색 실패 '+r.status);
  const j = await r.json(), items = [];
  (function walk(n){ if(n.type==='item') items.push(n); (n.results||[]).forEach(walk); })({results:j.results||[]});
  return items.map(it=>({
    kind: it.subtype, title: plain(it.title), context: plain(it.context||''), snippet: plain(it.snippet||''),
    link: (it.links&&(it.links['jw.org']||it.links.wol))||'', lank: it.lank||''
  }));
}
async function pool(tasks, n=5){
  let i = 0;
  await Promise.all(Array.from({length:n}, async()=>{ while(i<tasks.length){ const k=i++; await tasks[k](); } }));
}

async function libTx(mode, fn){
  const db = await libDb();
  return new Promise((res,rej)=>{
    let out;
    try{ const tx = db.transaction('files', mode), st = tx.objectStore('files');
      out = fn(st);
      tx.oncomplete = ()=>{ db.close(); res(out && out.result); };
      tx.onerror = ()=>{ const err=tx.error||new Error('자료 저장 중 오류'); db.close(); rej(err); };
      tx.onabort = ()=>{ const err=tx.error||new Error('자료 저장이 취소되었습니다'); db.close(); rej(err); };
    }catch(e){ db.close(); rej(e); }

async function libMergeFiles(incoming){
  if(!Array.isArray(incoming) || !incoming.length) return {added:0, renamed:0, skipped:0};
  const existing = await libTx('readonly', st=>st.getAll());
  const byName = new Map((existing||[]).map(f=>[f.name,f]));
  const writes = []; let added=0, renamed=0, skipped=0;
  for(const raw of incoming){
    if(!raw || !raw.name || !Array.isArray(raw.arts)) continue;
    const item = {name:String(raw.name), src:String(raw.src||raw.name), arts:raw.arts};
    const old = byName.get(item.name);
    if(!old){ writes.push(item); byName.set(item.name,item); added++; continue; }
    if(JSON.stringify(old.arts)===JSON.stringify(item.arts) && old.src===item.src){ skipped++; continue; }
    const base = item.name.replace(/(\.[^.]+)$/,'');
    const ext = (item.name.match(/(\.[^.]+)$/)||[])[1]||'';
    let n=1, candidate;
    do{ candidate = `${base} (백업 가져옴${n>1?' '+n:''})${ext}`; n++; }while(byName.has(candidate));
    item.name=candidate; writes.push(item); byName.set(candidate,item); added++; renamed++;
  }
  if(writes.length) await libTx('readwrite', st=>{ writes.forEach(f=>st.put(f)); });
  return {added, renamed, skipped};
}

// 최소한의 zip 읽기 (EPUB용): 중앙 디렉터리를 읽고 deflate는 브라우저의 DecompressionStream으로 푼다
async function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), out = new Map();
  let e = buf.byteLength - 22; while(e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if(e < 0) throw new Error('zip 형식이 아닙니다');
  let p = dv.getUint32(e+16, true); const n = dv.getUint16(e+10, true);
  const dec = new TextDecoder();
  for(let i=0;i<n;i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p+10, true), csize = dv.getUint32(p+20, true);
    const nl = dv.getUint16(p+28, true), xl = dv.getUint16(p+30, true), cl = dv.getUint16(p+32, true), lo = dv.getUint32(p+42, true);
    const name = dec.decode(u8.subarray(p+46, p+46+nl));
    out.set(name, async ()=>{
      const start = lo + 30 + dv.getUint16(lo+26, true) + dv.getUint16(lo+28, true);
      const data = u8.subarray(start, start+csize);
      if(method === 0) return dec.decode(data);
      if(typeof DecompressionStream==='undefined') throw new Error('현재 브라우저는 EPUB 압축 해제를 지원하지 않습니다. Chrome 또는 Edge 최신 버전에서 다시 시도하거나 TXT 파일을 사용해 주세요.');
      try{ return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text(); }
      catch(err){ throw new Error('EPUB 압축을 풀지 못했습니다. 브라우저를 최신 버전으로 업데이트하거나 TXT 파일을 사용해 주세요.'); }
    });
    p += 46 + nl + xl + cl;
  }
  return out;
}
async function parseEpub(file){
  const z = await unzip(await file.arrayBuffer());
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const cont = xml(await z.get('META-INF/container.xml')());
  const opfPath = cont.querySelector('rootfile').getAttribute('full-path');
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/')+1) : '';
  const opf = xml(await z.get(opfPath)());
  const tEl = opf.getElementsByTagName('dc:title')[0];
  const src = ((tEl && tEl.textContent) || file.name.replace(/\.epub$/i,'')).replace(/\s*\([a-z0-9-]+\)\s*$/i,'').trim();
  const man = {}; [...opf.getElementsByTagName('item')].forEach(it=>man[it.getAttribute('id')] = it.getAttribute('href'));
  const arts = [];
  for(const ir of [...opf.getElementsByTagName('itemref')]){
    const href = man[ir.getAttribute('idref')]; if(!href || !/x?html?$/i.test(href)) continue;
    const get = z.get(decodeURIComponent(base + href)) || z.get(base + href); if(!get) continue;
    const doc = new DOMParser().parseFromString(await get(), 'text/html');
    let cur = null;
    doc.body.querySelectorAll('h1,h2,h3,p,li').forEach(el=>{
      const txt = el.textContent.replace(/\s+/g,' ').trim(); if(!txt) return;
      if(/^H[123]$/.test(el.tagName)){ cur = {t:txt, x:''}; arts.push(cur); return; }
      if(el.tagName==='LI' && el.querySelector('p')) return;
      if(!cur){ cur = {t:src, x:''}; arts.push(cur); }
      cur.x += txt + '\n';
    });
  }
  return {src, arts: arts.filter(a=>a.x.length > 40)};
}
async function parseTxt(file){
  const text = await file.text();
  const src = /통찰/.test(file.name) ? '성경 통찰' : file.name.replace(/\.txt$/i,'').replace(/_색인_?\d*$/,'');
  let arts;
  if(/\n■ /.test(text)) arts = text.split(/\n(?=■ )/).map(a=>{ const i = a.indexOf('\n'); return {t:a.slice(0, i<0?a.length:i).replace(/^■\s*/,'').trim(), x:i<0?'':a.slice(i+1)}; });
  else { arts = []; for(let i=0;i<text.length;i+=3000) arts.push({t:`${src} (${arts.length+1})`, x:text.slice(i, i+3000)}); }
  return {src, arts: arts.filter(a=>a.x.trim().length > 40)};
}

function refRegex(ref){
  const m = ref.match(/^(.+?)\s(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?$/); if(!m) return null;
  const bn = bookNo(m[1]); if(!bn) return null;
  const full = BOOK_LIST[bn-1];
  const names = [...new Set([ABBR[bn-1], full, full.replace(/\s/g,'')])].map(s=>s.replace(/\s/g,'\\s?'));
  return {re: new RegExp(`(?<![가-힣])(?:${names.join('|')}) ${m[2]}:(\\d{1,3}(?:\\s*[-–,]\\s*\\d{1,3})*)`, 'g'), v1:+m[3], v2:+(m[4]||m[3])};
}
function citesVerse(list, v1, v2){
  for(const part of list.split(',')){
    const [a,b] = part.split(/[-–]/).map(x=>+x.trim());
    if(a && (b||a) >= v1 && a <= v2) return true;
  }
  return false;
}

const nsp = s => String(s).replace(/\s|&nbsp;/g,'');
const QWORDS = /^(무엇|어떻게|어떤|왜|누가|언제|어디|배울|있습니까|합니까|입니까|됩니까|있을까요|본에서|통해|대해|주제|요점|과|부록|장|면|항)$/;
function keywordsOfText(s, n=8){
  s = String(s).replace(/「[^」]*」/g,' ').replace(/\([^)]*\)/g,' ');
  const cnt = {}; keywordsOf(s).filter(w=>!QWORDS.test(w) && !/(니까|습니다|십시오|세요|습|면서|었|았|일을|하게)$/.test(w)).forEach(w=>cnt[w]=(cnt[w]||0)+1);
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,n);
}

    return Object.keys(grp).map(k=>{ const g = pick.filter(i=>i.kind===k); return g.length ? `\n[${grp[k]}]\n` + g.map((i,n)=>`${n+1}. ${i.title} (${i.source})\n${i.text}`).join('\n\n') : ''; }).join('');
  },
  KIND: {verse:['📜','성구 본문'], pub:['📕','출판물 참조'], study:['📘','연구 노트'], lib:['📚','내 자료'], article:['📰','jw.org'], exp:['🌱','경험담']},
  /* 조사 패널을 화면에 붙이기 */
  mount(box, key, {refs=[], kws=[], title='', pubs=null, ctx=null} = {}){
    const saved = Store.get('research', key) || null;
    const st = {refs: saved ? saved.refs : refs, kws: saved ? saved.kws : kws, pubs: saved && saved.pubs ? saved.pubs : (pubs||[]), items: saved ? saved.items : []};
    const pubOn = pubs!==null || !!ctx;
    const apiOn = !!(Settings.get('apiKey','')||'').trim() || (AI.provider()==='openrouter' && !!(Settings.get('openrouterKey','')||'').trim());
    const opts = Object.assign({verses:true, pubs:apiOn, study:apiOn, library:true, articles:true, exp:true}, Settings.get('researchOpts', {})); if(!apiOn){ opts.pubs = false; opts.study = false; }
    const draw = () => {
      const groups = Object.keys(this.KIND).map(k=>{ const g = st.items.filter(i=>i.kind===k); if(!g.length) return '';
        return `<div class="rgrp"><div class="rgh">${this.KIND[k][0]} ${this.KIND[k][1]} <span class="badge" data-cnt="${k}">${g.filter(i=>i.checked).length}/${g.length}</span> <button class="btn ghost sm" data-all="${k}" style="padding:2px 8px">모두 선택</button> <button class="btn ghost sm" data-none="${k}" style="padding:2px 8px">모두 해제</button></div>`
          + g.map(i=>`<label class="ritem"><input type="checkbox" data-id="${esc(i.id)}" ${i.checked?'checked':''}><div><b>${esc(i.title)}</b> <span class="badge">${esc(i.source)}</span>${i.link?` <a href="${esc(/^\//.test(i.link)?'https://wol.jw.org'+i.link:i.link)}" target="_blank" rel="noopener">원문 ↗</a>`:''}<div class="rtx">${esc(i.text)}</div></div></label>`).join('') + '</div>'; }).join('');
      box.innerHTML = `
        <div class="grid c2">
          <div><label>성구 (쉼표로 구분)</label><input type="text" data-k="refs" value="${esc(st.refs.join(', '))}" placeholder="예: 요한복음 1:1, 고린도 전서 15:6"></div>
          <div><label>핵심어 (쉼표로 구분)</label><input type="text" data-k="kws" value="${esc(st.kws.join(', '))}" placeholder="예: 부활, 희망"></div>
        </div>
        ${pubOn ? `<label>출판물 참조 (; 로 구분 — 비워 두면 교재 페이지에서 찾음)</label><input type="text" data-k="pubs" value="${esc(st.pubs.join('; '))}" placeholder="예: 「파17.10」 23면 9-10항; 「예레」 29면">` : ''}
        <div class="rops">${[['verses','성구 본문'], ...(pubOn ? [['pubs','출판물 참조'+(apiOn?'':' (Claude API 키 필요)')]] : []), ['study','연구 노트'+(apiOn?'':' (Claude API 키 필요)')],['library','내 자료'+(lib.length?'':' (없음)')],['articles','jw.org 기사'],['exp','경험담']].map(([k,t])=>`<label><input type="checkbox" data-o="${k}" ${opts[k]?'checked':''} ${(k==='study'||k==='pubs')&&!apiOn?'disabled':''}> ${t}</label>`).join('')}</div>
        <div class="row" style="margin-top:6px"><button class="btn" data-act="run">🔎 조사하기</button>${st.items.length?`<span class="st" style="margin:0" data-k="selcount">${st.items.filter(i=>i.checked).length}개 선택됨 — 체크한 자료만 AI 작성에 쓰입니다.</span>`:''}</div>
        <div class="st" data-k="status">${saved && saved.at ? '마지막 조사: '+fmtTime(saved.at) : ''}</div>
        ${groups}`;
      const save = () => Store.set('research', key, {refs:st.refs, kws:st.kws, pubs:st.pubs, items:st.items, at:(Store.get('research',key)||{}).at || Date.now(), title});
      $('[data-k=refs]', box).onchange = e=>{ st.refs = e.target.value.split(/[,;]/).map(x=>x.trim()).filter(Boolean); };
      $('[data-k=kws]', box).onchange = e=>{ st.kws = csv(e.target.value); };
      $$('[data-o]', box).forEach(c=>c.onchange = ()=>{ opts[c.dataset.o] = c.checked; Settings.set('researchOpts', {...opts}); });
      /* 체크하면 바로 저장하고, 위의 숫자(그룹별 n/전체, ‘n개 선택됨’)도 바로 고친다 */
      const recount = () => {
        Object.keys(this.KIND).forEach(k=>{ const b = $(`[data-cnt="${k}"]`, box); if(b){ const g = st.items.filter(i=>i.kind===k); b.textContent = `${g.filter(i=>i.checked).length}/${g.length}`; } });
        const sc = $('[data-k=selcount]', box); if(sc) sc.textContent = `${st.items.filter(i=>i.checked).length}개 선택됨 — 체크한 자료만 AI 작성에 쓰입니다.`;
      };
      $$('.ritem input', box).forEach(c=>c.onchange = ()=>{ st.items.filter(i=>i.id===c.dataset.id).forEach(it=>it.checked = c.checked); save(); recount(); });
      const setAll = (k, v) => { st.items.filter(i=>i.kind===k).forEach(i=>i.checked = v); $$('.ritem input', box).forEach(c=>{ const it = st.items.find(i=>i.id===c.dataset.id); if(it) c.checked = it.checked; }); save(); recount(); };
      $$('[data-all]', box).forEach(b=>b.onclick = e=>{ e.preventDefault(); setAll(b.dataset.all, true); });
      $$('[data-none]', box).forEach(b=>b.onclick = e=>{ e.preventDefault(); setAll(b.dataset.none, false); });
      $('[data-act=run]', box).onclick = async e=>{
        st.refs = $('[data-k=refs]', box).value.split(/[,;]/).map(x=>x.trim()).filter(Boolean).flatMap(r=>extractScriptures(r).length ? extractScriptures(r) : [r]);
        st.kws = csv($('[data-k=kws]', box).value);
        if($('[data-k=pubs]', box)) st.pubs = $('[data-k=pubs]', box).value.split(';').map(x=>x.trim()).filter(Boolean);
        const btn = e.currentTarget, stEl = $('[data-k=status]', box); btn.disabled = true; stEl.className = 'st';
        try{
          const {items, errs} = await this.run({refs:st.refs, kws:st.kws, pubs:pubOn ? st.pubs : [], ctx:pubOn ? ctx : null}, opts, m=>{ const live=$('[data-k=status]',box); if(live) live.textContent=m; });
          st.items = items; Store.set('research', key, {refs:st.refs, kws:st.kws, pubs:st.pubs, items, at:Date.now(), title});
          draw();
          const s2 = $('[data-k=status]', box);
          s2.className = 'st' + (errs.length ? ' err' : ' ok');
          s2.textContent = `${items.length}개를 찾았습니다.` + (errs.length ? ' 일부 실패 — '+errs.join(' / ') : '') + (!items.length && !errs.length ? ' 성구나 핵심어를 바꿔 보세요.' : '');
        }catch(err){
          const live=$('[data-k=status]',box); if(live){ live.className='st err'; live.textContent='조사 중 오류: '+(err.message||String(err)); }
        }finally{
          const liveBtn=$('[data-act=run]',box); if(liveBtn) liveBtn.disabled=false;
        }
      };
    };
    draw();
  }
};

/* =========================================================
   5-4. 공개 강연 연설문 (연설문 도우미를 새 엔진 위에)
   연설 = { id, topic, total, notes, sections:[{title, minutes, points}], speech, used, updatedAt }
   소재목 i의 자료 조사 키: talk:<id>#<i>
   ========================================================= */
const CPM = 330;   // 분당 글자 수(공백 포함)
const MARK_SRC = '[(\\[]\\s*(\\d{1,2})\\s*분\\s*[)\\]]';   // (3분) [3분]
function normText(s){
  return String(s).normalize('NFKC')
    .replace(/[​-‍⁠﻿­]/g,'')
    .replace(/[   -   　]/g,' ')
    .replace(/[‐-―−]/g,'-');
}
// 출력물 머리말·꼬리말(저작권, 연사 유의 사항 안내문 등) 제거 + "30분에 다룰 것" 인식
function cleanOutline(raw){
  let s = normText(raw), total = null;
  const tm = s.match(/(\d{1,2})\s*분에\s*다룰\s*것/); if(tm) total = +tm[1];
  s = s.replace(/\[?\s*골자에\s*밀접히[\s\S]*$/,'').replace(/(?:\d{1,2}\s*분에\s*다룰\s*것)?\s*©[\s\S]*$/,'').replace(/\d{1,2}\s*분에\s*다룰\s*것\s*$/,'');
  return {text:s, total};
}
function splitPoints(chunk){
  const parts = chunk.split(/(?<=[)\]?])\s+(?![(「])|(?<=\.)\s+|\s+(?=\[(?!시각))/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  for(const p of parts){
    if(out.length && /^\[시각 자료/.test(p)) out[out.length-1] += ' '+p;   // [시각 자료 N] 은 앞 요점에 붙임
    else out.push(p);
  }
  return out.join('\n');
}
function findMarks(text){
  let marks = [...text.matchAll(new RegExp(MARK_SRC,'g'))];
  if(marks.length<2){                                     // 괄호가 없는 "3분" 표기까지 허용 ("30분에" 같은 말은 제외)
    const m2 = [...text.matchAll(/(?<![\d:])(\d{1,2})\s*분(?![가-힣])/g)];
    if(m2.length>marks.length) marks = m2;
  }
  return marks;
}
function parseFlat(text0){
  const text = text0.replace(/\s+/g,' ').trim();
  const marks = findMarks(text);
  if(marks.length<1) return null;
  // 구간 끝에서 소재목 제목이 시작되는 위치: 직전 요점의 끝( ")" "]" 또는 문장 끝 ) 바로 뒤
  const titleStart = seg => {
    let best = Math.max(seg.lastIndexOf(')'), seg.lastIndexOf(']')) + 1;
    for(const m of seg.matchAll(/(?:있다|한다|준다|된다|이다)\.?\s+|\.\s+/g)){
      const e = m.index+m[0].length; if(e<seg.length && e>best) best = e;
    }
    return best;
  };
  let topic=null, notes=null;
  const starts = []; let prevEnd = 0;
  marks.forEach((m,i)=>{
    const seg = text.slice(prevEnd, m.index).trimEnd();
    let s = titleStart(seg);
    if(i===0){
      const k = seg.search(/유의\s*(?:점|사항)\s*[:：]/);
      if(k>=0){
        topic = seg.slice(0,k).trim().replace(/\s*연사의\s*$/,'').replace(/^주제\s*[:：]?\s*/,'');
        const after = seg.slice(k).replace(/^유의\s*(?:점|사항)\s*[:：]\s*/,'');
        const t = titleStart(after);
        notes = after.slice(0,t).trim();
        s = (seg.length - after.length) + t;
      }
    }
    starts.push(prevEnd + s);
    prevEnd = m.index + m[0].length;
  });
  const out = marks.map((m,i)=>{
    const title = text.slice(starts[i], m.index).trim().replace(/[\s:：\-–—]+$/,'').replace(/^(?:\d+\s*[.)]\s*|[•·▪■□●○◆◇▶►※*\-–—]+\s*)/,'');
    const endPts = i+1<marks.length ? starts[i+1] : text.length;
    return {title, minutes:+m[1], points:splitPoints(text.slice(m.index+m[0].length, endPts).trim()), extra:'', results:null};
  });
  return {topic, notes, out};
}
function parseLines(text){
  const BUL = /^[\s\-–—•·▪■□●○◆◇▶►※*]+/, NUM = /^\d+\s*[.)]\s+/;
  const MINP = /[(\[][^)\]\n]*?(\d{1,2})\s*(?:분|min)[^)\]\n]*[)\]]/i;
  const MINT = /(?:^|\s)(\d{1,2})\s*(?:분|min)\s*(?:간)?\s*$/i;
  const minOf = s => { const m = s.match(MINP) || s.match(MINT); return m ? +m[1] : null; };
  const strip = s => s.replace(MINP,'').replace(MINT,'').replace(/[\s:：\-–—]+$/,'').trim();
  const clean = s => s.replace(BUL,'').replace(NUM,'').trim();
  const mk = (title,minutes)=>({title, minutes:minutes||3, points:'', extra:'', results:null});
  const lines = text.split(/\r?\n/).map(l=>l.trim());
  let topic=null, notes=null; const body=[]; let inNotes=false, started=false;
  const NOTE = /^(?:연사의\s*)?유의\s*(?:점|사항)\s*[:：]?\s*(.*)$/;
  const firstIdx = lines.findIndex(l=>clean(l));
  const early = lines.slice(firstIdx<0?0:firstIdx, (firstIdx<0?0:firstIdx)+8).map(clean).filter(Boolean).slice(0,5);
  const hasNoteHead = early.slice(1).some(t=>NOTE.test(t));
  for(let i=0;i<lines.length;i++){
    const l = lines[i], t = clean(l);
    if(!t){ body.push(''); inNotes=false; continue; }
    if(minOf(t)!=null){ started = true; inNotes = false; body.push(l); continue; }   // 시간이 적힌 줄은 소재목 → 머리말 끝
    if(!started && !topic && (/^(주제|제\s*\d+\s*번)/.test(t) || (i===firstIdx && hasNoteHead))){
      topic = t.replace(/^주제\s*[:：]?\s*/,''); continue;                       // 맨 첫 줄(강연 제목)
    }
    if(!started){
      const n = t.match(NOTE);
      if(n){ notes = n[1]; inNotes = true; continue; }
      if(inNotes){ notes = (notes?notes+' ':'') + t; continue; }
    }
    started = true; body.push(l);
  }
  const byMinutes = ()=>{
    const out=[]; let cur=null;
    for(const l of body){
      const t = clean(l); if(!t) continue;
      const m = minOf(t);
      if(m!=null){
        const title = strip(t);
        if(!title){                       // "(3분)" 만 있는 줄 → 바로 앞 줄이 소재목
          if(cur && cur.points){ const a=cur.points.split('\n'); const ttl=a.pop(); cur.points=a.join('\n'); cur = mk(ttl,m); out.push(cur); }
          else if(cur && !cur.title){ cur.minutes=m; }
          continue;
        }
        cur = mk(title,m); out.push(cur);
      } else {
        if(!cur){ cur = mk('',3); out.push(cur); }
        cur.points += (cur.points?'\n':'')+t;
      }
    }
    return out.filter(s=>s.title || s.points);
  };
  const byMarker = ()=>{
    const out=[]; let cur=null;
    const isHead = l => /^\s*[■□●○◆◇▶►]/.test(l) || /^\s*소재목\s*\d*/.test(l) || /^\s*[IVX]+\s*[.)]\s+/.test(l);
    for(const l of body){
      if(!clean(l)) continue;
      const t = clean(l).replace(/^소재목\s*\d*\s*[:：.)]?\s*/,'');
      if(isHead(l)){ cur = mk(strip(t), minOf(t)); out.push(cur); }
      else { if(!cur){ cur=mk('',3); out.push(cur);} cur.points += (cur.points?'\n':'')+clean(l); }
    }
    return out;
  };
  const byBlank = ()=>{
    const out=[]; let blk=[];
    const flush=()=>{ if(blk.length){ const c=mk(strip(blk[0]),minOf(blk[0])); c.points=blk.slice(1).join('\n'); out.push(c); blk=[]; } };
    for(const l of body){ const t=clean(l); if(!t) flush(); else blk.push(t); }
    flush(); return out;
  };
  let out = byMinutes(), how='시간 표시(분)';
  if(out.length<2){ const o=byMarker(); if(o.length>=2){ out=o; how='● ■ ▶ 등 기호'; } }
  if(out.length<2){ const o=byBlank();  if(o.length>=2){ out=o; how='빈 줄'; } }
  if(out.length===1 && !out[0].title && out[0].points.includes('\n')){
    const [t,...rest]=out[0].points.split('\n'); out[0].title=t; out[0].points=rest.join('\n');
  }
  return {topic, notes, out, how};

function parseOutlineText(raw){
  let {text, total} = cleanOutline(raw);
  if(!text.trim()) return {error:'붙여넣은 골자가 없습니다.'};
  const nonEmpty = text.split(/\r?\n/).filter(l=>l.trim());
  const markRe = new RegExp(MARK_SRC);
  const nMarks = findMarks(text).length, nMarkLines = nonEmpty.filter(l=>markRe.test(l)).length, oneLiners = nonEmpty.some(l=>findMarks(l).length>=2);
  let res = null, how = '';
  if(nMarks>=1 && (oneLiners || nMarkLines<nMarks || nonEmpty.length<=3)){ res = parseFlat(text); how = res ? '(N분) 표시' : ''; }
  if(!res || res.out.length<2){ const r2 = parseLines(text); if(!res || r2.out.length>res.out.length){ res = r2; how = r2.how; } }
  if(!res || !res.out.length) return {error:'골자를 나누지 못했습니다. 소재목 줄 끝에 (3분)처럼 시간이 있는지 확인하세요.'};
  if(res.out.length===1 && res.out[0].title){
    const pl = res.out[0].points.split('\n').map(x=>x.trim()).filter(Boolean);
    if(pl.length>=2){ const N = +res.out[0].minutes||0, k = pl.length, base = Math.max(1, Math.floor(N/k)), rem = N>=k ? N-base*k : 0;
      res.topic = res.out[0].title; if(N) total = N;
      res.out = pl.map((line,i)=>({title:line.replace(/\s*[(（][^)）]*[)）]/g,'').replace(/\s*\[[^\]]*\]/g,'').replace(/\s+/g,' ').trim()||line, minutes:base+(i<rem?1:0), points:line})); }
  }
  const sections = res.out.map(s=>({title:s.title||'', minutes:+s.minutes||3, points:s.points||''}));
  const pts = sections.reduce((a,s)=>a+s.points.split('\n').filter(Boolean).length,0), scr = sections.reduce((a,s)=>a+extractScriptures(s.points).length,0);
  return {topic:res.topic||'', notes:res.notes||'', total, sections, msg:`${how} 기준으로 나눔 — 소재목 ${sections.length}개 · 요점 ${pts}개 · 성구 ${scr}개 · 합계 ${sections.reduce((a,s)=>a+s.minutes,0)}분`};
}

const WT = {
  parse(raw){
    const lines = String(raw).replace(/\ufeff/g,'').split(/\r?\n/).map(l=>l.replace(/\s+$/,'').replace(/^\s*#{1,6}\s*/,'').replace(/\*\*/g,'').replace(/^\s*질문\s*(\d)/,'$1').replace(/^(\s*\d{1,2}(?:\s*[,-]\s*\d{1,2})?)\s*[.)．]\s*(?=\S)/,'$1. '));
    const a = {title:'', theme:'', song:'', summary:'', paras:[], review:[], src:'', ans:{}};
    let i = 0, head = '', cur = null, inReview = false, pre = [];
    const skip = l => /^답을 적는 칸$/.test(l.trim());
    for(; i<lines.length; i++){
      const l = lines[i].trim(); if(!l || skip(l)) continue;
      let m;
      if((m = l.match(/^출처:\s*(\S+)/))){ a.src = m[1]; continue; }
      if(/^어떻게 대답하시겠습니까\?/.test(l)){ inReview = true; cur = null; continue; }
      if(inReview){ if(/^노래\s*\d+/.test(l)) { inReview = false; continue; } if(!/^[a-z]\s/.test(l)) a.review.push(l); continue; }
      if((m = l.match(/^(\d{1,2}(?:\s*[,-]\s*\d{1,2})?)\.\s+(.+)$/))){ cur = {qn:m[1].replace(/\s+/g,''), q:m[2], text:'', head, cap:''}; head = ''; a.paras.push(cur); continue; }
      if(!a.paras.length){ pre.push(l); continue; }
      if(/^[a-z]\s/.test(l) || /^노래\s*\d+/.test(l)) continue;
      if(/\(\d+(?:[-,]\d+)?항 참조\)$/.test(l)){ if(cur) cur.cap += (cur.cap?'\n':'') + l; continue; }
      if(cur && (/^\d{1,2}\s/.test(l) || (!cur.text && l.length > 40))){ cur.text += (cur.text?'\n':'') + l.replace(/^\d{1,2}\s/,''); continue; }
      if(cur && cur.text && l.length <= 40 && !/[.?!”」)]$/.test(l)){ head = l; continue; }
      if(cur) cur.text += (cur.text?'\n':'') + l;
    }
    /* 머리말: 날짜, 노래, 제목, 주제 성구, 요점 */
    pre = pre.filter(l=>!/^\d{4}년\s*\d{1,2}월/.test(l));
    const si = pre.findIndex(l=>/^노래\s*\d+/.test(l)); if(si>=0){ a.song = pre[si]; pre.splice(si,1); }
    const ti = pre.findIndex(l=>/^[“"].+[”"]\s*—/.test(l));
    if(ti>0){ a.theme = pre[ti]; a.title = pre[ti-1]; pre.splice(0, ti+1, ...pre.slice(ti+1, ti+1).concat([])); pre = pre.slice(0); }
    else { a.title = pre.shift() || ''; const t2 = pre.findIndex(l=>/^[“"].+[”"]\s*—/.test(l)); if(t2>=0){ a.theme = pre[t2]; pre.splice(t2,1); } }
    const yi = pre.indexOf('요점'); if(yi>=0) a.summary = pre.slice(yi+1).join(' ');
    return a;
  },

const JWAuto = {
  status(){ return Settings.get('jwAuto', null); },
  async load({force=false, quiet=true} = {}){
    if(!Sync.token()) { if(!quiet) toast('먼저 설정에서 Gist 동기화를 연결해 주세요.'); return null; }
    try{
      const raw = await Sync.readFile('jw-weekly.json');
      if(!raw){ if(!quiet) toast('아직 받은 자료가 없습니다. GitHub Actions에서 ‘Run workflow’를 한 번 눌러 주세요.'); return null; }
      const j = JSON.parse(raw); const prev = this.status();
      if(!force && prev && prev.generated===j.generated) return prev;
      const files = (j.files||[]).map(f=>({name:f.name, text:async()=>f.text}));
      const r = await importJWFiles(files); r.weeks.forEach(w=>Weeks.mergeInto(w, {preferNew:true}));
      const st = {generated:j.generated, at:Date.now(), weeks:r.weeks.length, wt:r.wt, bible:r.bible, cbs:r.cbs||0, pubrefs:r.pubrefs||0};
      Settings.set('jwAuto', st);
      toast(`jw.org 자료를 받았습니다 — 교재 ${r.weeks.length}주 · 파수대 ${r.wt}개 · 성경 범위 ${r.bible}개 · 성서 연구 ${r.cbs||0}개 · 참조 출판물 ${r.pubrefs||0}개`);
      render(); return st;
    }catch(e){ if(!quiet) toast('jw.org 자료를 읽지 못했습니다: '+(e.message||e)); return null; }
  }
};
async function importJWFiles(files){
  const res = {weeks:[], wt:0, bible:0};
  for(const f of files){
    const text = await f.text(), name = f.name;
    const d = (name.match(/^(\d{4}-\d{2}-\d{2})_/)||[])[1];
    if(/집회교재/.test(name) || (!d && /성경에 담긴 보물/.test(text))){ res.weeks.push(...Weeks.parseWorkbook(text, name)); continue; }
    const wid = d ? Weeks.ymd(Weeks.monday(new Date(d+'T00:00:00'))) : null;
    if(/참조출판물\.json$/.test(name) && wid){ try{ const list = JSON.parse(text); Store.set('pubrefs', wid, list); res.pubrefs = (res.pubrefs||0)+list.length; }catch(e){} continue; }
    if(/회중성서연구/.test(name) && wid){ const [ref, ...rest] = text.split('\n'); Store.set('cbs', wid, {ref:ref.trim(), text:rest.join('\n').trim(), ans:(Store.get('cbs', wid)||{}).ans||{}}); res.cbs = (res.cbs||0)+1; continue; }
    if(/성경범위/.test(name) && wid){ Store.set('bible', wid, {range:(name.match(/성경범위_(.+)\.txt$/)||[])[1]||'', text}); res.bible++; continue; }
    if(wid){ const a = WT.parse(text); if(a.paras.length){ const old = Store.get('wt', wid); if(old && old.ans) a.ans = old.ans; Store.set('wt', wid, a); res.wt++; } }
  }
  return res;
}

/* =========================================================
   5-7. jw.org 온라인 라이브러리(WOL)에서 주간 자료 가져오기
   브라우저는 wol.jw.org를 직접 읽을 수 없어서, AI 제공자의 web_fetch 도구로 그 주의 ‘집회’ 페이지를 열고
   생활과 봉사 집회 교재·파수대 연구 기사를 D:\JW 파일과 같은 글 형식으로 받아 온다.
   ========================================================= */
const WOL = {
  isoWeek(d){ const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1)); return {y:x.getUTCFullYear(), w:Math.ceil(((x - y0)/86400000 + 1)/7)}; },
  meetingsUrl(id){ const {y, w} = this.isoWeek(new Date(id+'T00:00:00')); return `https://wol.jw.org/ko/wol/meetings/r8/lp-ko/${y}/${w}`; },
  async fetchWeek(id, {mwb=true, wt=true} = {}, onStatus){
    const url = this.meetingsUrl(id), label = Weeks.labelOf(id);
    const want = [mwb ? '생활과 봉사 집회 교재' : '', wt ? '「파수대」 연구 기사' : ''].filter(Boolean).join('와 ');
    const prompt = `다음은 jw.org 온라인 라이브러리의 ${label} 집회 페이지입니다: ${url}
이 페이지를 web_fetch로 여십시오. 이 주의 ${want} 본문이 이 페이지에 들어 있으면 그것을 쓰고, 없으면 페이지에 연결된 링크를 web_fetch로 열어 본문을 그대로 옮겨 주십시오. 열린 페이지의 주가 ${label}이 아니면 페이지 안의 앞뒤 주 링크를 따라가 ${label} 주를 찾으십시오.
요약하거나 고치지 말고, 화면의 글을 순서대로 옮기십시오. 그림 파일·메뉴는 빼고, 마크다운 기호(#, **, -)는 쓰지 말고 일반 글로 쓰십시오. 질문 줄은 반드시 "1. 질문"처럼 번호와 마침표로 시작하십시오.

출력 형식 (이 표시줄을 그대로 쓰십시오):
${mwb ? `===집회교재===
첫 줄: ${label}
둘째 줄: 성경 읽기 범위 (예: 예레미야 51-52장)
그다음: "노래 N 및 기도 | 소개말 (1분)", 구역 제목(성경에 담긴 보물 / 야외 봉사에 힘쓰십시오 / 그리스도인 생활), 순서마다 "번호. 제목" 줄과 그 아래 "(N분) 부제…" 줄, 이어서 교재 본문, 중간 노래 "노래 N", 마지막 "맺음말 (3분) | 노래 N 및 기도"
` : ''}${wt ? `===파수대===
첫 줄: 연구 주간 (예: 2026년 11월 9-15일), 시작 노래, 기사 제목, 주제 성구, "요점"과 요점 문장
그다음 질문마다: "번호. 질문" 한 줄, 이어서 그 항 본문 (본문 첫머리에 항 번호), 소제목은 한 줄로, 삽화 설명은 "(N항 참조)"로 끝나는 한 줄
끝에: "어떻게 대답하시겠습니까?"와 복습 질문, 마치는 노래
` : ''}===출처===
연 페이지 주소들

페이지를 열 수 없으면 ===오류=== 아래에 이유를 쓰십시오.`;
    onStatus && onStatus('OpenRouter로 jw.org 온라인 라이브러리에서 가져오는 중… (1-2분)');
    const text = await AI.research({prompt, maxTokens:32000, domains:['wol.jw.org'], maxUses:5});
    WOL.lastRaw = text;
    /* 마크다운(##, **, - ) 표시를 걷어 내고, 표시줄(===…===)의 모양이 조금 달라도 찾는다 */
    const md = s => String(s).replace(/\r/g,'').split('\n').map(l=>l.replace(/^\s*#{1,6}\s*/,'').replace(/^\s*>\s?/,'').replace(/\*\*|__/g,'').replace(/^\s*[-•]\s+(?=\S)/,'  ').replace(/^\s*\*\s+/,'  ').replace(/^(\d{1,2})\)\s/,'$1. ')).filter(l=>!/^\s*(-{3,}|={3,}|`{3,}.*)\s*$/.test(l)).join('\n');
    const sec = name => { const m = text.split(new RegExp('^[\\s#*]*={2,}\\s*' + name + '\\s*={2,}[\\s*]*$', 'm'))[1]; return m ? md(m.split(/^[\s#*]*={2,}\s*[^=\n]+?\s*={2,}[\s*]*$/m)[0]).trim() : ''; };
    const err = sec('오류'); if(err && !sec('집회교재') && !sec('파수대')) throw new Error(err.slice(0,200));
    let mwbText = sec('집회교재'), wtText = sec('파수대');
    if(!mwbText && !wtText){ const all = md(text); if(mwb && /성경에 담긴 보물/.test(all)) mwbText = all; if(wt && /\n\s*1\.\s/.test(all)) wtText = all; }
    return {mwbText, wtText, src:sec('출처'), url};
  },
  /* 가져와서 저장까지 */
  async importWeek(id, opts, onStatus){
    const r = await this.fetchWeek(id, opts, onStatus);
    const out = {mwb:false, wt:false};
    if(r.mwbText){ const ws = Weeks.parseWorkbook(r.mwbText, '', id); if(ws.length){ const w = ws[0]; w.id = id; w.label = Weeks.labelOf(id); w.src = w.src || (r.src.match(/https:\/\/wol\.jw\.org\S+/)||[r.url])[0]; Weeks.mergeInto(w); out.mwb = true; } }
    if(r.wtText){ const a = WT.parse(r.wtText); if(a.paras.length){ const old = Store.get('wt', id); if(old && old.ans) a.ans = old.ans; a.src = a.src || r.url; Store.set('wt', id, a); out.wt = true; } }
    if(!out.mwb && !out.wt){ const e = new Error('가져온 글에서 교재나 기사를 찾지 못했습니다. 아래 ‘받은 글 보기’를 열어 내용을 확인해 주세요.'); e.raw = WOL.lastRaw; throw e; }

const CBS = {

  parse(text){
    const bl = String(text||'').replace(/﻿/g,'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    const c = {num:'', person:'', title:'', story:[], verses:[], groups:[], more:[]};
    let i = 0;
    if(/^\d{1,3}\s/.test(bl[0]||'') && /^\d{1,3}\s/.test(bl[1]||'') && bl[0].split(' ')[0]===bl[1].split(' ')[0]) bl.shift();   // EPUB 제목 줄 중복
    const m0 = (bl[0]||'').match(/^(\d{1,3})\s+(.+)$/); if(m0){ c.num = m0[1]; c.person = m0[2]; i = 1; }
    if(bl[i] && !this.HEADS.includes(bl[i])) { c.title = bl[i]; i++; }
    let sec = null, qn = 0;
    for(; i<bl.length; i++){
      const l = bl[i];
      if(/^\^\s*\(/.test(l)){ c.verses.push(l.replace(/^\^\s*/,'')); continue; }
      if(/^(또는|직역하면|달리 번역하면|용어 설명)/.test(l) || /^삽화\s*\S{0,2}$/.test(l) || l==='답을 적는 칸') continue;
      if(this.HEADS.includes(l)){ sec = {head:l, qs:[]}; c.groups.push(sec); continue; }
      if(!sec){ c.story.push(l); continue; }
      if(bl[i+1]==='답을 적는 칸'){ qn++; sec.qs.push({id:'q'+qn, q:l}); continue; }
      if(sec.head==='더 찾아보기' || sec.head==='성경 기록을 읽어 보십시오') { c.more.push({head:sec.head, t:l}); continue; }
      c.more.push({head:sec.head, t:l});
    }
    c.groups = c.groups.filter(g=>g.qs.length);
    return c;
  },

    <p class="desc">단계별로 하나씩 넣어 갑니다. 기존 앱에서 쓰던 내용은 ‘설정 → 기존 앱 데이터 가져오기’로 미리 옮겨 둘 수 있습니다.</p>
    <ul class="plan">${items.map(([ic,t,d,step])=>`<li><span class="ic">${ic}</span><div><b>${t} <span class="badge">${step}</span></b><span>${d}</span></div></li>`).join('')}</ul></div>`;
}

                       <input type="text" data-f="sub" value="${esc(p.sub)}" placeholder="부제·장면 (예: 호별 방문)" style="margin-top:6px">`

          ${p.detail && !editing ? `<details class="pd"><summary>교재 내용 보기</summary><div>${esc(p.detail).replace(/\n/g,'<br>')}</div></details>` : ''}

      </style>

      ${setup}
      <div class="wkbar">
        <button class="btn ghost sm" id="wPrev" ${i<=0?'disabled':''} aria-label="이전 주">◀</button>
        <select id="wSel">${ids.map(x=>`<option value="${x}" ${x===id?'selected':''}>${esc(Weeks.labelOf(x))}${x===Weeks.thisId()?' (이번 주)':''}${Weeks.get(x)?'':' — 교재 없음'}</option>`).join('')}</select>
        <button class="btn ghost sm" id="wNext" ${i>=ids.length-1?'disabled':''} aria-label="다음 주">▶</button>
        ${!isThis ? '<button class="btn ghost sm" id="wToday">이번 주로</button>' : ''}
        <button class="btn sm" id="wPrint">🖨 순서지 인쇄</button>
        <button class="btn ghost sm" id="wEdit">${editing ? '✔ 편집 끝' : '✎ 순서 편집'}</button>
      </div>
      ${mine.length ? `<div class="mybar">🙋 이번 주 내 과제: ${mine.join(' · ')}</div>` : ''}
      <div class="card">

      <div class="card"><h2>🔎 이번 주 자료 조사</h2><p class="desc">순서를 고르면 그 순서의 성구와 핵심어가 자동으로 채워집니다. 조사한 자료는 순서별로 저장되어 해설·연설 작성에 쓰입니다.</p>
        <label>조사할 순서</label><select id="rTarget">${w.parts.map(p=>`<option value="${p.no}">${p.no}. ${esc(p.title)}</option>`).join('')}</select>
        <div id="weekR" style="margin-top:6px"></div></div>
      <div class="card"><h2>📋 이번 주 적용점 모아보기</h2><p class="desc">교재 순서마다 생활과 봉사에 적용할 점을 한두 문장씩 모아 줍니다.</p>

    $$('[data-w]', el).forEach(inp=>inp.addEventListener('input', ()=>{ w[inp.dataset.w] = inp.value; commit(); }));
    $$('[data-song]', el).forEach(inp=>inp.addEventListener('input', ()=>{ const k = +inp.dataset.song; w.songs[k] = inp.value.replace(/\D/g,''); $(`[data-songname="${k}"]`, el).textContent = SONGS[w.songs[k]]||''; commit(); }));
    $$('.prow[data-no]', el).forEach(row=>{

    if($('#wDel')) $('#wDel').onclick = e=>{ const b = e.currentTarget; if(!b.dataset.arm){ b.dataset.arm = 1; b.textContent = '한 번 더 누르면 삭제'; setTimeout(()=>{ delete b.dataset.arm; b.textContent='이 주 삭제'; }, 3000); return; }

    $('#addWeek').onclick = ()=>{ const v = $('#newWeek').value.trim(); const d = /^\d{4}-\d{1,2}-\d{1,2}$/.test(v) ? new Date(v.replace(/-(\d)(?!\d)/g,'-0$1')+'T00:00:00') : null;

      try{ const txt = await AI.write({system:'당신은 여호와의 증인 평일 집회 교재에서 실제적인 적용점을 뽑아 주는 도우미입니다. 교재에 없는 내용을 지어내지 않습니다.',

        <div class="row" style="margin-top:8px"><input type="text" id="rosName" placeholder="이름 한 명 추가" style="max-width:150px"><input type="text" id="rosGroup" placeholder="집단 (예: 3집단)" style="max-width:130px">
          <select id="rosRole" style="max-width:130px">${Members.ROLES.map(r=>`<option>${r}</option>`).join('')}</select>

      <div class="card">
        <h2>🎨 화면</h2>
        <label>밝기</label>
        <div class="seg" id="themeSeg">${[['light','밝게'],['dark','어둡게'],['system','기기 설정 따르기']].map(([v,t])=>`<button data-v="${v}" class="${theme===v?'on':''}">${t}</button>`).join('')}</div>
        <label>글자 크기</label>
        <div class="seg" id="fsSeg">${[['0.93','작게'],['1','보통'],['1.1','크게'],['1.2','아주 크게']].map(([v,t])=>`<button data-v="${v}" class="${fs===v?'on':''}">${t}</button>`).join('')}</div>
