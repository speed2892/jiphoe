      <div class="card">
        <h2>📱 휴대폰·태블릿에 설치</h2>
        <ul class="plan">
          <li><span class="ic">🤖</span><div><b>안드로이드 (크롬·삼성 인터넷)</b><span>메뉴 ⋮ → ‘앱 설치’ 또는 ‘홈 화면에 추가’</span></div></li>
          <li><span class="ic">🍎</span><div><b>아이폰·아이패드 (사파리)</b><span>공유 버튼 → ‘홈 화면에 추가’</span></div></li>
          <li><span class="ic">📶</span><div><b>오프라인</b><span>한 번 열어 두면 인터넷 없이도 앱이 열립니다. (AI 작성·자료 조사는 인터넷 필요)</span></div></li>
        </ul>
        <p class="desc" style="margin-top:10px">버전 ${APP.version}</p>
      </div>`;
    $('#aiProvider').value = s.get('aiProvider','openrouter');
    $('#model').value = s.get('model','claude-sonnet-5-5');
    $('#openrouterModel').value = s.get('openrouterModel','openrouter/free');

    /* AI */
    $('#aiSave').onclick = ()=>{ const ck0=s=>String(s||'').replace(/[^\x21-\x7E]/g,''); const ok=ck0($('#openrouterKey').value), ck=ck0($('#apiKey').value), st=$('#aiSt');
      if(ok && !/^sk-or-/.test(ok)){ st.className='st err'; st.textContent='OpenRouter 키 형식을 확인해 주세요. 보통 sk-or-로 시작합니다.'; return; }
      if(ck && !/^sk-ant-/.test(ck)){ st.className='st err'; st.textContent='Claude 키는 sk-ant- 로 시작해야 합니다.'; return; }
      s.set('openrouterKey',ok); s.set('apiKey',ck); s.set('aiProvider',$('#aiProvider').value);
      s.set('openrouterModel',$('#openrouterModel').value); s.set('model',$('#model').value);
      st.className='st ok'; st.textContent='저장했습니다. 선택한 서비스가 기본 AI로 사용됩니다.'; refreshPills(); };
    $('#aiTest').onclick = async ()=>{ const p=$('#aiProvider').value, st=$('#aiSt');
      const k=p==='openrouter' ? ($('#openrouterKey').value.trim()||s.get('openrouterKey','')) : ($('#apiKey').value.trim()||s.get('apiKey',''));
      const m=p==='openrouter' ? $('#openrouterModel').value : $('#model').value;
      if(!k){ st.className='st err'; st.textContent=p==='openrouter'?'OpenRouter 키를 먼저 입력해 주세요.':'Claude API 키를 먼저 입력해 주세요.'; return; }
      st.className='st'; st.textContent='연결 확인 중…';
      try{ await AI.test(k,m,p); st.className='st ok'; st.textContent='연결 성공! 저장을 누르면 선택한 서비스가 기본 AI가 됩니다.'; }
      catch(e){ st.className='st err'; st.textContent='연결 실패: '+(e.message||'인터넷 연결을 확인하세요.'); } };
    $('#aiClear').onclick = ()=>{ const p=$('#aiProvider').value, st=$('#aiSt');
      if(p==='openrouter'){ s.set('openrouterKey',null); $('#openrouterKey').value=''; }
      else { s.set('apiKey',null); $('#apiKey').value=''; }
      st.className='st'; st.textContent=p==='openrouter'?'OpenRouter 키를 지웠습니다.':'Claude API 키를 지웠습니다.'; refreshPills(); };
    $('#aiProvider').onchange = ()=>{ s.set('aiProvider',$('#aiProvider').value); };
    $('#model').onchange = ()=>s.set('model', $('#model').value);
    $('#openrouterModel').onchange = ()=>s.set('openrouterModel', $('#openrouterModel').value);

    /* 동기화 */
    $('#syncConnect').onclick = async ()=>{ const t = $('#ghToken').value.trim(), st = $('#syncSt');
      if(!t){ st.className='st err'; st.textContent='토큰을 넣어 주세요.'; return; }
      st.className='st'; st.textContent='연결하는 중…';
      try{ await Sync.connect(t); st.className='st ok'; st.textContent='연결했습니다. 이제 자동으로 동기화됩니다.'; render(); }
      catch(e){ st.className='st err'; st.textContent='연결 실패: '+e.message; } };
    if($('#jwAutoLoad')) $('#jwAutoLoad').onclick = async ()=>{ $('#jwAutoLoad').disabled = true; await JWAuto.load({force:true, quiet:false}); render(); };
    $('#syncNow').onclick = async ()=>{ await Sync.now(); render(); toast(Sync.status().state==='ok' ? '동기화했습니다.' : '동기화 오류: '+Sync.status().err); };
    $('#syncOff').onclick = ()=>{ Sync.disconnect(); render(); toast('동기화 연결을 해제했습니다. 이 기기의 내용은 그대로 남습니다.'); };

    /* 기존 데이터 */
    const lb = $('#legacyScan');
    if(lb) lb.onclick = ()=>{ let msg = [];
      if(Object.keys(scan.meeting).length){ msg.push(`집회 계획표 ${Legacy.importMeeting(scan.meeting, '이 기기')}개`); }
      if(scan.speech){ Legacy.importSpeech(scan.speech, '이 기기'); msg.push('연설문 도우미 1건'); }
      toast(msg.join(', ')+'을 가져왔습니다.'); render(); };
    $('#legacyGo').onclick = ()=>{ const st = $('#legacySt'); let j;
      try{ j = JSON.parse($('#legacyBox').value.trim()); }catch(e){ st.className='st err'; st.textContent='글을 읽지 못했습니다. 내보낸 글 전체를 붙여넣어 주세요.'; return; }
      if(!j || j.app!=='jipoe-plan' || !j.data){ st.className='st err'; st.textContent='집회 계획표에서 내보낸 글이 아닙니다.'; return; }
      const c = Legacy.summarize(j.data), n = Legacy.importMeeting(j.data, '붙여넣기');
      st.className='st ok'; st.textContent = `${n}개를 가져왔습니다. (이름 배정 ${c.names} · 파수대 ${c.wt} · 영적 보물 ${c.gems} · 기타 ${c.other})`;
      $('#legacyBox').value=''; setTimeout(render, 1200); };

    /* 백업: Store 자료 + IndexedDB의 내 자료를 함께 저장 */
    const backupPayload = async()=>{
      const snap=Store.snapshot(), libraryFiles=await libTx('readonly', st=>st.getAll());
      return {...snap, app:APP.id, v:2, savedAt:Date.now(), library:{files:libraryFiles||[]}};
    };
    const backupText = async()=>JSON.stringify(await backupPayload());
    $('#bkSave').onclick = async ()=>{ const st=$('#bkSt'); st.className='st'; st.textContent='집회 기록과 내 자료를 모으는 중…';
      try{ const txt=await backupText(), a = document.createElement('a'), d = new Date();
        a.href = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
        a.download = `집회준비_전체백업_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000); st.className='st ok'; st.textContent='집회 기록과 내 자료를 포함한 전체 백업 파일을 저장했습니다.';
      }catch(err){ st.className='st err'; st.textContent='백업을 만들지 못했습니다: '+(err.message||err); } };
    $('#bkCopy').onclick = async ()=>{ const st=$('#bkSt'); st.className='st'; st.textContent='백업 글을 준비하는 중…';
      try{ await navigator.clipboard.writeText(await backupText()); st.className='st ok'; st.textContent='집회 기록과 내 자료를 포함한 백업 글을 복사했습니다.'; }
      catch(e){ st.className='st err'; st.textContent='복사하지 못했습니다. ‘백업 파일 저장’을 사용해 주세요.'; } };
    $('#bkLoad').onclick = ()=>$('#bkFile').click();
    $('#bkFile').onchange = async e=>{ const f = e.target.files[0]; e.target.value=''; if(!f) return; const st = $('#bkSt'); st.className='st'; st.textContent='백업을 확인하고 복원하는 중…';
      try{ const j = JSON.parse(await f.text());
        if(j.app==='jipoe-plan'){ const n = Legacy.importMeeting(j.data||{}, '파일'); st.className='st ok'; st.textContent=`집회 계획표 백업 ${n}개를 가져왔습니다.`; return; }
        if(j.app!==APP.id || !j.stamps){ st.className='st err'; st.textContent='이 앱의 백업 파일이 아닙니다.'; return; }
        const {changedLocal, conflicts=0} = Store.merge(j);
        let libMsg='';
        if(j.library && Array.isArray(j.library.files)){
          const r=await libMergeFiles(j.library.files);
          libMsg=` 내 자료 ${r.added}개 추가${r.renamed?` (이름이 겹쳐 ${r.renamed}개는 별도 보관)`:''}, ${r.skipped}개 동일하여 건너뜀.`;
          await libLoad();
        }else libMsg=' 이 백업에는 내 자료가 포함되어 있지 않습니다(이전 버전 백업).';
        st.className='st ok'; st.textContent=`백업을 합쳤습니다. 바뀐 기록 ${changedLocal}개, 새 충돌 ${conflicts}건.${libMsg}`;
      }catch(err){ st.className='st err'; st.textContent='복원하지 못했습니다: '+(err.message||String(err)); } };
    $('#syncConflictExport').onclick = ()=>{ const items=Store.conflicts(); if(!items.length) return;
      const a=document.createElement('a'), d=new Date(); a.href=URL.createObjectURL(new Blob([JSON.stringify({app:APP.id, exportedAt:Date.now(), conflicts:items},null,2)],{type:'application/json'}));
      a.download=`집회준비_동기화충돌_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    };

    /* 내 자료 */
    $('#libPick').onclick = ()=>$('#libFile').click();
    $('#libFile').onchange = async e=>{ const files = [...e.target.files]; e.target.value=''; const st = $('#libSt'); st.className='st';
      for(const f of files){
        try{ if(/\.jwpub$/i.test(f.name)){ st.textContent = `${f.name}: .jwpub은 읽을 수 없습니다.`; continue; }
          st.textContent = `${f.name} 읽는 중…`;
          const r = /\.epub$/i.test(f.name) ? await parseEpub(f) : await parseTxt(f);
          await libTx('readwrite', x=>x.put({name:f.name, src:r.src, arts:r.arts}));
          st.textContent = `${f.name}: 「${r.src}」 ${r.arts.length.toLocaleString()}항목 저장`;
        }catch(err){ st.className='st err'; st.textContent = `${f.name}: 읽지 못했습니다 (${err.message})`; } }
      await libLoad(); render(); };
    $('#libClear').onclick = async e=>{ const b = e.currentTarget; if(!b.dataset.arm){ b.dataset.arm=1; b.textContent='한 번 더 누르면 비웁니다'; setTimeout(()=>{ delete b.dataset.arm; b.textContent='내 자료 비우기'; },3000); return; }
      try{ await libTx('readwrite', x=>x.clear()); }catch(err){} await libLoad(); render(); toast('내 자료를 비웠습니다.'); };
    /* 나와 회중 */
    /* 회중 명단 */
    const rosList = () => {
      const by = {}; Members.all().forEach(m=>{ (by[m.group||'집단 없음'] ||= []).push(m); });
      const keys = Object.keys(by).sort((a,b)=>(parseInt(a)||99)-(parseInt(b)||99) || a.localeCompare(b,'ko'));
      $('#rosList').innerHTML = keys.length ? keys.map(g=>`<div style="margin-top:8px"><b>${esc(g)}</b> <span class="desc">(${by[g].length}명)</span><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${by[g].map(m=>`<span class="pill" title="${esc(Members.label(m))}">${esc(m.name)}${m.role!=='전도인'?` <small>${esc(m.role)}</small>`:''} <button class="btn ghost sm" data-rdel="${esc(m.name)}" style="padding:0 6px">×</button></span>`).join('')}</div></div>`).join('') : '<p class="desc">아직 명단이 없습니다.</p>';
      $$('[data-rdel]', $('#rosList')).forEach(b=>b.onclick = ()=>{ Members.remove(b.dataset.rdel); rosList(); $('#rosSt').textContent = `지금 명단 ${Members.all().length}명`; });
    };
    rosList();
    const rosRun = (text, from) => {
      const st = $('#rosSt'); st.className = 'st';
      try{
        const r = Members.importRoster(text);
        st.textContent = `${from}: 새로 넣음 ${r.added.length}명 · 이미 있음 ${r.existed.length}명 → 지금 명단 ${Members.all().length}명`;
        $('#rosReport').innerHTML = (r.added.length ? `<div class="note"><b>새로 넣은 사람 (${r.added.length})</b><br>${r.added.map(esc).join(', ')}</div>` : '<div class="note">새로 넣을 사람이 없습니다. 모두 이미 있습니다.</div>')
          + (r.notInRoster.length ? `<div class="note" style="margin-top:6px"><b>임명표에는 있지만 명단 파일에 없는 이름 (${r.notInRoster.length})</b><br>${r.notInRoster.map(esc).join(', ')}<br><span class="desc">오타이거나 다른 회중 사람일 수 있습니다. 필요하면 아래에서 한 명씩 추가하세요.</span></div>` : '');
        rosList();
      }catch(err){ st.className = 'st err'; st.textContent = `${from}: 읽지 못했습니다 (${err.message})`; }
    };
    $('#rosFileBtn').onclick = ()=>$('#rosFile').click();
    $('#rosFile').onchange = async e=>{ const f = e.target.files[0]; if(f) rosRun(await f.text(), f.name); e.target.value=''; };
    $('#rosPasteBtn').onclick = ()=>{ const t = $('#rosPaste').value.trim(); if(t) rosRun(t, '붙여 넣은 글'); else toast('명단 글을 먼저 붙여 넣으세요.'); };
    $('#rosAdd').onclick = ()=>{ const n = Members.clean($('#rosName').value); if(!n) return;
      if(Members.has(n)){ toast(`${n}님은 이미 명단에 있습니다.`); return; }
      Members.add({name:n, group:$('#rosGroup').value.trim(), role:$('#rosRole').value, gender:$('#rosGender').value});
      $('#rosName').value=''; rosList(); $('#rosSt').textContent = `지금 명단 ${Members.all().length}명`; toast(`${n}님을 추가했습니다.`); };
    $('#myName').onchange = ()=>{ s.set('myName', $('#myName').value.trim()); $('#meSt').textContent='저장했습니다.'; };
    /* 화면 */
    $$('#themeSeg button').forEach(b=>b.onclick = ()=>{ s.set('theme', b.dataset.v==='system' ? null : b.dataset.v); applyTheme(); render(); });
    $$('#fsSeg button').forEach(b=>b.onclick = ()=>{ s.set('fontScale', b.dataset.v==='1' ? null : b.dataset.v); applyTheme(); render(); });
  }
};


/* 교재 불러오기·기존 임명표 가져오기 (이번 주 화면과 설정에서 함께 씀) */
function bindImport(el){
  const st = $('#impSt', el); if(!st) return;
  const apply = (list, from) => {
    if(!list.length){ st.className='st err'; st.textContent = '주를 하나도 찾지 못했습니다. 글 형식을 확인해 주세요.'; return; }
    let nNew = 0, nMerged = 0; list.forEach(w=>{ Weeks.mergeInto(w)==='new' ? nNew++ : nMerged++; });
    st.className = 'st ok'; st.textContent = `${from}: 새 주 ${nNew}개, 갱신 ${nMerged}개 (${list.map(w=>w.label).join(', ')})`;
    toast(`${list.length}주를 불러왔습니다.`);
    if(!Settings.get('weekSel') || !Weeks.get(Settings.get('weekSel'))) Settings.set('weekSel', list[0].id);
    setTimeout(render, 1500);
  };
  $('#impFiles', el).onclick = ()=>$('#impFile', el).click();
  $('#impFile', el).onchange = async e=>{ const files = [...e.target.files]; e.target.value=''; const r = await importJWFiles(files);
    if(r.wt || r.bible) toast(`연구 기사 ${r.wt}개, 성경 읽기 ${r.bible}개도 함께 저장했습니다.`);
    if(r.weeks.length) apply(r.weeks, `파일 ${files.length}개`); else { st.className='st ok'; st.textContent = `연구 기사 ${r.wt}개, 성경 읽기 ${r.bible}개를 저장했습니다.`; } };
  $('#impPasteBtn', el).onclick = ()=>{ const b = $('#impPasteBox', el); b.hidden = !b.hidden; if(!b.hidden) $('#impPaste', el).focus(); };
  $('#impPasteGo', el).onclick = ()=>apply(Weeks.parseWorkbook($('#impPaste', el).value, '', Settings.get('weekSel') || Weeks.thisId()), '붙여넣은 글');
  $('#impOld', el).onclick = async ()=>{
    st.className='st'; st.textContent='기존 임명표를 찾는 중…';
    const list = [];
    try{ const loc = JSON.parse(LS.get('jiboe_v6','null')); (loc && (loc.data||loc.D) || []).forEach(x=>{ const w = Weeks.fromSchedule(x); if(w) list.push(w); }); }catch(e){}
    try{ const o = JSON.parse(LS.get('jwmeeting_v8','null')); (Array.isArray(o)?o:[]).forEach(x=>{ const w = Weeks.fromOrder(x); if(w) list.push(w); }); }catch(e){}
    let remoteErr = '';
    try{ (await Weeks.fetchOldSchedule()).forEach(x=>{ const w = Weeks.fromSchedule(x); if(w) list.push(w); }); }catch(e){ remoteErr = e.message; }
    if(!list.length){ st.className='st err'; st.textContent = '기존 임명표를 찾지 못했습니다.' + (remoteErr ? ' (온라인 임명표: '+remoteErr+')' : ''); return; }
    const byId = {}; list.forEach(w=>{ const o = byId[w.id]; if(!o) byId[w.id] = w; else { byId[w.id] = {...o, ...Object.fromEntries(Object.entries(w).filter(([k,v])=>v && (!Array.isArray(v) || v.length)))}; } });
    apply(Object.values(byId).sort((a,b)=>a.id.localeCompare(b.id)), '기존 임명표' + (remoteErr ? ' (온라인은 못 읽음)' : ''));
  };
}


function showRaw(st, raw){
  if(!raw) return;
  const d = document.createElement('details'); d.className = 'more';
  d.innerHTML = `<summary>받은 글 보기 (${raw.length.toLocaleString()}자)</summary><textarea readonly style="min-height:200px;margin-top:8px;font-size:.82rem"></textarea><div class="row"><button class="btn sm ghost">받은 글 복사</button></div>`;
  $('textarea', d).value = raw;
  $('button', d).onclick = async ()=>{ try{ await navigator.clipboard.writeText(raw); toast('복사했습니다. 대화창에 붙여 주시면 원인을 찾아 드립니다.'); }catch(e){} };
  st.after(d);
}
/* 붙여넣은 jw.org 글: 교재인지 파수대 기사인지 알아서 나눠 그 주에 저장 */
function importPasted(text, weekId){
  text = String(text||'').trim(); if(!text) return {err:'붙여넣은 글이 없습니다.'};
  if(/성경에 담긴 보물|야외 봉사에 힘쓰십시오/.test(text)){
    const ws = Weeks.parseWorkbook(text, '', weekId);
    if(!ws.length) return {err:'교재 순서를 찾지 못했습니다. 교재 본문 전체를 복사했는지 확인해 주세요.'};
    const w = ws.find(x=>x.id===weekId) || ws[0]; if(ws.length===1){ w.id = weekId; }
    ws.forEach(x=>Weeks.mergeInto(x)); return {kind:'교재', label:ws.map(x=>Weeks.labelOf(x.id)).join(', '), id:ws[0].id};
  }
  const a = WT.parse(text);
  if(a.paras.length >= 3){ const old = Store.get('wt', weekId); if(old && old.ans) a.ans = old.ans; Store.set('wt', weekId, a); return {kind:'파수대 연구 기사', label:`${Weeks.labelOf(weekId)} · ${a.title} (질문 ${a.paras.length}개)`, id:weekId}; }
  return {err:'교재나 연구 기사로 알아보지 못했습니다. 본문 전체를 복사해 붙여넣어 주세요.'};
}
function bindWol(el){
  const open = $('#wolOpen', el); if(!open) return;
  const st = $('#wolSt', el);
  const wid = () => { const v = $('#wolDate', el).value || Weeks.thisId(); return Weeks.ymd(Weeks.monday(new Date(v+'T00:00:00'))); };
  open.onclick = ()=>{ window.open(WOL.meetingsUrl(wid()), '_blank', 'noopener'); st.className='st'; st.textContent = `${Weeks.labelOf(wid())} 집회 페이지를 열었습니다. 교재나 기사를 복사해 아래에 붙여넣으세요.`; };
  $('#wolPut', el).onclick = ()=>{ const r = importPasted($('#wolPaste', el).value, wid());
    if(r.err){ st.className='st err'; st.textContent = r.err; return; }
    st.className='st ok'; st.textContent = `${r.kind}를 넣었습니다: ${r.label}`; $('#wolPaste', el).value = ''; Settings.set('weekSel', r.id); toast(`${r.kind}를 넣었습니다.`); setTimeout(render, 900); };
}
/* =========================================================
   7. 라우터·공통 상태 표시
   ========================================================= */
let current = null;
function render(){
  const id = (location.hash.slice(1) || Settings.get('lastView') || 'week');
  const v = VIEWS.find(x=>x.id===id) || VIEWS[0];
  if(current !== v.id) window.scrollTo(0, 0);
  current = v.id; Settings.set('lastView', v.id);
  $$('#sideNav a, #bottomNav a').forEach(a=>{ if(a.dataset.v===v.id) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#topTitle').textContent = v.id==='week' ? APP.name : v.title;
  document.title = (v.id==='week' ? '' : v.title+' · ') + APP.name;
  Views[v.id]($('#view'));
}
function applyTheme(){
  const t = Settings.get('theme','system');
  const dark = t==='dark' || (t!=='light' && matchMedia('(prefers-color-scheme: dark)').matches);
  if(dark) document.documentElement.dataset.theme = 'dark'; else delete document.documentElement.dataset.theme;
  document.documentElement.style.setProperty('--fs', Settings.get('fontScale','1'));
  $('meta[name=theme-color]').content = dark ? '#172430' : '#245b78';
}
function refreshPills(){
  const m = AI.mode();
  $('#aiPill').innerHTML = `<span class="dot ${m?'ok':'warn'}"></span>${m==='openrouter' ? 'AI: OpenRouter 무료 모델' : m==='claude' ? 'AI: claude.ai 계정' : m==='api' ? 'AI: Claude API' : 'AI 연결 안 됨'}`;
  const s = Sync.status();
  $('#syncPill').innerHTML = `<span class="dot ${s.state==='ok'?'ok':s.state==='err'?'bad':s.state==='busy'?'warn':''}"></span>${s.state==='ok' ? '동기화 '+fmtTime(s.lastAt) : s.state==='err' ? '동기화 오류' : s.state==='busy' ? '동기화 중…' : '동기화 꺼짐'}`;
  $('#topSync').textContent = s.state==='ok' ? '☁️' : s.state==='err' ? '⚠️' : s.state==='busy' ? '🔄' : '☁️';
  $('#topSync').style.opacity = s.state==='off' ? .45 : 1;
}
$('#verTxt').textContent = 'v'+APP.version;
$('#topSettings').onclick = ()=>{ location.hash = 'settings'; };
$('#topSync').onclick = ()=>{ if(Sync.token()){ Sync.now(); toast('동기화하는 중…'); } else location.hash = 'settings'; };
window.addEventListener('hashchange', render);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
document.addEventListener('syncstate', ()=>{ refreshPills(); if(['week','settings'].includes(current) && !document.activeElement.matches('input,textarea')) render(); });
document.addEventListener('aistate', ()=>{ refreshPills(); if(['week','settings'].includes(current)) render(); });
Store.on(info=>{ if(info.remote && ['week','settings'].includes(current) && !document.activeElement.matches('input,textarea')) render(); });

/* 앱을 새로 열 때 지난 주가 선택되어 있으면 이번 주로 돌아오기 */
if((Settings.get('weekSel')||'') < Weeks.thisId()) Settings.set('weekSel', Weeks.thisId());
applyTheme(); render(); refreshPills(); AI.probe(); if(Sync.token()){ Sync.now(); setTimeout(()=>JWAuto.load(), 1500); }
/* 새 버전 확인: GitHub Pages는 파일을 최대 10분 캐시하므로, 서버의 index.html 버전을 직접 비교해 알려 준다 */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load', async ()=>{
    try{ const reg = await navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}); reg.update(); }catch(e){}
    let reloaded = false; navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(!reloaded && sessionStorage.getItem('jh.upd')){ reloaded = true; sessionStorage.removeItem('jh.upd'); location.reload(); } });
  });
}
async function checkUpdate(){
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const html = await (await fetch('./index.html?v='+Date.now(), {cache:'no-store'})).text();
    const v = (html.match(/version:'([^']+)'/)||[])[1];
    if(v && v !== APP.version && !$('#updBar')){
      const bar = document.createElement('div'); bar.id = 'updBar';
      bar.style.cssText = 'position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-weight:600;max-width:92vw';
      bar.innerHTML = `새 버전 v${esc(v.split(' ')[0])}이 있습니다 <button class="btn sm" style="background:#fff;color:#245b78;border-color:#fff">지금 바꾸기</button>`;
      bar.querySelector('button').onclick = async ()=>{ sessionStorage.setItem('jh.upd','1');
        try{ const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.update())); const ks = await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){}
        location.replace(location.pathname + '?u=' + Date.now() + location.hash); };
      document.body.appendChild(bar);
    }
  }catch(e){}
}
addEventListener('load', ()=>setTimeout(checkUpdate, 1500));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkUpdate(); });
</script>
